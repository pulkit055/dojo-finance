<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dojo Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── PALETTE: warm stone + coral + forest green ── */
:root {
  --stone-50:  #faf9f7;
  --stone-100: #f3f0eb;
  --stone-200: #e8e3db;
  --stone-300: #d4cdc2;
  --stone-400: #a89f94;
  --stone-500: #7a7068;
  --stone-600: #57504a;
  --stone-700: #3d3832;
  --stone-800: #2a2520;
  --coral:     #e07055;
  --coral-l:   #f5d4cb;
  --coral-d:   #c05540;
  --forest:    #3d6b55;
  --forest-l:  #c8ddd4;
  --forest-d:  #2a4d3c;
  --amber:     #c4873a;
  --amber-l:   #f2e0c8;
  --plum:      #7c5c8a;
  --plum-l:    #e0d4e8;
  --sand:      #b8944a;

  /* Chart colors — warm, no blue */
  --c1: #3d6b55;   /* forest green  */
  --c2: #e07055;   /* coral         */
  --c3: #c4873a;   /* amber         */
  --c4: #7c5c8a;   /* plum          */
  --c5: #5a8a6e;   /* sage          */

  --bg:      var(--stone-50);
  --surface: #ffffff;
  --border:  var(--stone-200);
  --text:    var(--stone-800);
  --text2:   var(--stone-500);
  --text3:   var(--stone-400);

  --r:    16px;
  --r-sm: 10px;
  --r-xs:  6px;
  --sh:    0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.06);
  --sh-sm: 0 1px 2px rgba(0,0,0,0.06);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── BOTTOM NAV ── */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid var(--border);
  display: flex; height: 68px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -1px 0 var(--border), 0 -4px 20px rgba(0,0,0,0.06);
}
.bni {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px; border: none; background: transparent;
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.2,0,0,1),
              opacity 0.15s;
  padding: 6px 4px;
  position: relative;
}
.bni:active { transform: scale(0.92); }
.bni .ico { font-size: 21px; line-height: 1; transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1); }
.bni .lbl { font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: 0.3px; transition: color 0.15s; }
.bni.active .lbl { color: var(--forest); }
.bni.active .ico { transform: translateY(-2px) scale(1.1); }
.bni.active::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 32px; height: 3px; border-radius: 0 0 4px 4px;
  background: var(--forest);
}

/* ── PAGES ── */
.page { display: none; padding: 20px 16px 90px; max-width: 1100px; margin: 0 auto; }
.page.active { display: block; }
.page.enter { animation: slideUp 0.22s cubic-bezier(0.2,0,0,1) both; }
@keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

/* ── HEADER ── */
.pg-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; padding-top: 6px;
}
.pg-title {
  font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
  color: var(--text); text-wrap: balance;
}
.pg-title em { font-style: normal; color: var(--forest); }
.sync-tag {
  font-size: 11px; font-weight: 700; padding: 5px 10px;
  border-radius: 20px; border: 1px solid var(--border);
  color: var(--text2); background: var(--surface);
  transition: color 0.2s, border-color 0.2s;
}

/* ── MONTH PILLS ── */
.month-strip {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 4px; margin-bottom: 18px;
  scrollbar-width: none;
}
.month-strip::-webkit-scrollbar { display: none; }
.yr-grp { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
.yr-tag {
  font-size: 9px; font-weight: 800; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--text3); padding-left: 2px;
}
.yr-row { display: flex; gap: 4px; }
.mpill {
  padding: 7px 13px; border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface); font-size: 12px; font-weight: 700;
  color: var(--text2); cursor: pointer; flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s, color 0.15s,
              transform 0.1s, box-shadow 0.15s;
  position: relative;
}
.mpill:active { transform: scale(0.94); }
.mpill.active {
  background: var(--forest); border-color: var(--forest);
  color: white; box-shadow: 0 2px 8px rgba(61,107,85,0.35);
}
.mpill.cur { border-color: var(--coral); color: var(--coral); }
.mpill.cur.active { background: var(--coral); border-color: var(--coral); color: white; box-shadow: 0 2px 8px rgba(224,112,85,0.35); }
.mpill.has-data::after {
  content: ''; position: absolute; top: 3px; right: 3px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--forest); border: 1.5px solid white;
}
.mpill.cur.has-data::after { background: var(--coral); }

/* ── SECTION CARDS ── */
.sec {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  box-shadow: var(--sh); margin-bottom: 10px;
}
.sec-hd {
  padding: 15px 16px; display: flex; align-items: center;
  justify-content: space-between; cursor: pointer;
  transition: background 0.12s;
  -webkit-user-select: none; user-select: none;
}
.sec-hd:active { background: var(--stone-100); }
.sec-hd-l { display: flex; align-items: center; gap: 10px; }
.sec-ico { font-size: 18px; }
.sec-nm { font-size: 15px; font-weight: 800; }
.sec-r { display: flex; align-items: center; gap: 8px; }
.sec-tot { font-size: 13px; font-weight: 700; color: var(--text2); }
.chev {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--stone-100); display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text3);
  transition: transform 0.2s cubic-bezier(0.2,0,0,1), background 0.15s;
}
.sec.col .chev { transform: rotate(-90deg); }
.sec.col .sec-bd { display: none; }
.sec-bd { border-top: 1px solid var(--border); }

/* ── CATEGORY HEADER ── */
.cat-hd {
  padding: 8px 16px 8px 24px;
  background: var(--stone-100);
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  text-transform: uppercase; color: var(--text3);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.cat-sum { font-size: 11px; font-weight: 700; color: var(--text2); font-variant-numeric: tabular-nums; }

/* ── ROW ITEMS ── */
.ri {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 16px 9px 28px; gap: 10px;
  border-bottom: 1px solid rgba(0,0,0,0.04);
}
.ri:last-child { border-bottom: none; }
.ri-lbl { font-size: 13px; font-weight: 500; color: var(--text2); flex: 1; line-height: 1.3; }
.inp {
  width: 110px; padding: 7px 10px;
  background: var(--stone-100); border: 1.5px solid transparent;
  border-radius: var(--r-xs); color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 700;
  text-align: right; outline: none;
  transition: border-color 0.15s, background 0.15s;
  font-variant-numeric: tabular-nums;
}
.inp:focus {
  border-color: var(--forest); background: var(--forest-l);
}
.inp.filled {
  border-color: rgba(61,107,85,0.3);
  background: rgba(200,221,212,0.35);
  color: var(--forest-d);
}
.inp::placeholder { color: var(--text3); font-weight: 400; }

/* ── DEBT ROW ── */
.dri { flex-direction: column; align-items: stretch; padding: 11px 16px 11px 28px; gap: 7px; }
.dri-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dri-bal { display: flex; align-items: center; gap: 8px; }
.dbar-bg { flex: 1; height: 4px; background: var(--stone-200); border-radius: 2px; overflow: hidden; }
.dbar-fill { height: 100%; border-radius: 2px; background: var(--forest); transition: width 0.4s cubic-bezier(0.2,0,0,1); }
.dbal-txt {
  font-size: 11px; font-weight: 700; color: var(--coral);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.dbal-txt.done { color: var(--forest); }

/* ── SAVE BAR ── */
.sbar {
  position: sticky; bottom: 68px; z-index: 10;
  padding: 10px 0 2px;
  background: linear-gradient(to top, var(--bg) 55%, transparent);
  display: flex; gap: 10px; align-items: center;
}
.btn-save {
  flex: 1; padding: 14px 20px;
  background: var(--forest); color: white; border: none;
  border-radius: var(--r-sm);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px; font-weight: 800; cursor: pointer;
  box-shadow: 0 3px 10px rgba(61,107,85,0.35);
  transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
  will-change: transform;
}
.btn-save:active { transform: scale(0.97); box-shadow: 0 1px 4px rgba(61,107,85,0.25); background: var(--forest-d); }
.saved-msg { font-size: 12px; font-weight: 700; color: var(--forest); opacity: 0; transition: opacity 0.25s; white-space: nowrap; }
.saved-msg.on { opacity: 1; }

/* ── KPI ROW ── */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 13px 14px;
  box-shadow: var(--sh-sm); position: relative; overflow: hidden;
}
.kpi::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
}
.kpi.k1::after { background: var(--forest); }
.kpi.k2::after { background: var(--coral); }
.kpi.k3::after { background: var(--amber); }
.kpi.k4::after { background: var(--plum); }
.kpi-lbl { font-size: 9px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
.kpi-val { font-size: 17px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi-val.pos { color: var(--forest); }
.kpi-val.neg { color: var(--coral); }
.kpi-val.amb { color: var(--amber); }
.kpi-sub { font-size: 10px; color: var(--text3); margin-top: 4px; }

/* ── CHART CARDS ── */
.chart-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 16px;
  margin-bottom: 10px; box-shadow: var(--sh-sm);
}
.chart-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
}
.chart-nm { font-size: 13px; font-weight: 800; color: var(--text); }
.ctabs { display: flex; gap: 3px; }
.ctab {
  padding: 4px 10px; border-radius: 20px;
  border: 1.5px solid var(--border);
  background: transparent; font-size: 10px; font-weight: 700;
  color: var(--text3); cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.1s;
}
.ctab:active { transform: scale(0.93); }
.ctab.on { background: var(--forest); border-color: var(--forest); color: white; }
/* Fixed chart size */
.chart-box { height: 160px; position: relative; }
.chart-box canvas { position: absolute; inset: 0; width: 100%!important; height: 100%!important; }

/* ── BUDGET ── */
.budget-wrap { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bi {
  background: var(--stone-100); border-radius: var(--r-sm);
  padding: 10px 12px;
}
.bi-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.bi-nm { font-size: 11px; font-weight: 700; color: var(--text2); }
.bi-st { font-size: 10px; font-weight: 800; }
.bi-st.ok { color: var(--forest); }
.bi-st.warn { color: var(--amber); }
.bi-st.over { color: var(--coral); }
.bi-bar { height: 4px; background: var(--stone-200); border-radius: 2px; overflow: hidden; margin-bottom: 5px; }
.bi-fill { height: 100%; border-radius: 2px; transition: width 0.5s cubic-bezier(0.2,0,0,1); }
.bi-fill.ok { background: var(--forest); }
.bi-fill.warn { background: var(--amber); }
.bi-fill.over { background: var(--coral); }
.bi-amts { display: flex; justify-content: space-between; font-size: 9px; font-weight: 600; color: var(--text3); font-variant-numeric: tabular-nums; }

/* ── TABLES ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  box-shadow: var(--sh-sm); margin-bottom: 10px;
}
.card-hd {
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-nm { font-size: 13px; font-weight: 800; }
.twrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { width: 100%; border-collapse: collapse; }
table.t th {
  padding: 8px 12px; font-size: 9px; font-weight: 800;
  letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--text3); text-align: right; white-space: nowrap;
  background: var(--stone-100); border-bottom: 1px solid var(--border);
}
table.t th:first-child { text-align: left; }
table.t td {
  padding: 8px 12px; font-size: 12px; font-weight: 600;
  text-align: right; white-space: nowrap;
  color: var(--text2); border-bottom: 1px solid rgba(0,0,0,0.04);
  font-variant-numeric: tabular-nums;
}
table.t td:first-child { text-align: left; color: var(--text); font-weight: 700; }
table.t tr:last-child td { border-bottom: none; }
table.t tr.tot td {
  font-weight: 800; border-top: 2px solid var(--border);
  color: var(--text); background: var(--stone-100);
}
table.t tr:hover:not(.tot) td { background: var(--stone-50); }
td.pos { color: var(--forest)!important; }
td.neg { color: var(--coral)!important; }
td.dim { color: var(--text2); }
td.mut { color: var(--text3)!important; }

/* ── DEBT PAGE ── */
.debt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.dc {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 13px 14px;
  box-shadow: var(--sh-sm);
}
.dc-nm { font-size: 12px; font-weight: 800; margin-bottom: 4px; }
.dc-rem { font-size: 16px; font-weight: 800; color: var(--coral); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.dc-rem.done { color: var(--forest); }
.dc-prog { height: 4px; background: var(--stone-200); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
.dc-fill { height: 100%; border-radius: 2px; background: var(--forest); transition: width 0.5s; }
.dc-sub { display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; color: var(--text3); font-variant-numeric: tabular-nums; }

/* ── ADD LOAN MODAL ── */
.overlay {
  position: fixed; inset: 0; background: rgba(42,37,32,0.45);
  z-index: 500; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border-radius: var(--r) var(--r) 0 0;
  padding: 24px 20px calc(28px + env(safe-area-inset-bottom, 0px));
  width: 100%; max-width: 520px;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
  box-shadow: 0 -4px 32px rgba(0,0,0,0.14);
}
.overlay.open .modal { transform: translateY(0); }
.modal-drag { width: 36px; height: 4px; border-radius: 2px; background: var(--stone-200); margin: 0 auto 20px; }
.modal-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { font-size: 11px; font-weight: 800; color: var(--text2); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.field input {
  width: 100%; padding: 13px 14px;
  background: var(--stone-100); border: 1.5px solid var(--border);
  border-radius: var(--r-sm); font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 600; color: var(--text); outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.field input:focus { border-color: var(--forest); background: var(--forest-l); }
.modal-btns { display: flex; gap: 8px; margin-top: 20px; }
.btn-ghost {
  flex: 1; padding: 13px; background: var(--stone-100); color: var(--text2);
  border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;
  transition: transform 0.1s;
}
.btn-ghost:active { transform: scale(0.97); }
.btn-add {
  flex: 2; padding: 13px; background: var(--forest); color: white;
  border: none; border-radius: var(--r-sm);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 800;
  cursor: pointer; box-shadow: 0 2px 8px rgba(61,107,85,0.3);
  transition: transform 0.1s, background 0.15s;
}
.btn-add:active { transform: scale(0.97); background: var(--forest-d); }
.add-loan-btn {
  display: flex; align-items: center; gap: 6px; padding: 7px 13px;
  background: var(--forest-l); color: var(--forest-d);
  border: 1.5px solid rgba(61,107,85,0.25); border-radius: 20px;
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: transform 0.1s;
}
.add-loan-btn:active { transform: scale(0.95); }

@media (min-width: 600px) {
  .kpis { grid-template-columns: repeat(4,1fr); }
  .debt-grid { grid-template-columns: repeat(3,1fr); }
  .budget-wrap { grid-template-columns: repeat(3,1fr); }
  .page { padding: 24px 24px 90px; }
  .chart-box { height: 180px; }
  .entry-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: start;
  }
  .entry-cols .sec { margin-bottom: 10px; }
}
</style>
</head>
<body>

<!-- ENTRY -->
<div class="page active" id="page-entry">
  <div class="pg-head">
    <div class="pg-title">Monthly <em>Entry</em></div>
    <span class="sync-tag" id="syncTag">—</span>
  </div>
  <div class="month-strip" id="monthStrip"></div>
  <div id="entryGrid"></div>
  <div class="sbar">
    <button class="btn-save" onclick="saveMonth()">Save Month</button>
    <span class="saved-msg" id="savedMsg">✓ Saved!</span>
  </div>
</div>

<!-- DASHBOARD -->
<div class="page" id="page-dashboard">
  <div class="pg-head"><div class="pg-title"><em>Dashboard</em></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="chart-card">
    <div class="chart-top">
      <span class="chart-nm">Monthly Trend</span>
      <div class="ctabs">
        <button class="ctab on" onclick="switchMain('overview',this)">Overview</button>
        <button class="ctab" onclick="switchMain('discipline',this)">Discipline</button>
        <button class="ctab" onclick="switchMain('category',this)">Category</button>
      </div>
    </div>
    <div class="chart-box"><canvas id="mainChart"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-top">
      <span class="chart-nm">Where Money Goes</span>
      <div class="ctabs">
        <button class="ctab on" onclick="switchDonut('all',this)">All time</button>
        <button class="ctab" onclick="switchDonut('month',this)">This month</button>
      </div>
    </div>
    <div class="chart-box" style="height:180px"><canvas id="donutChart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-hd"><span class="card-nm" id="budgetNm">💰 Budget Allocation</span></div>
    <div class="budget-wrap" id="budgetWrap"></div>
  </div>
  <div class="card">
    <div class="card-hd"><span class="card-nm">🥋 Income by Discipline</span></div>
    <div class="twrap"><table class="t" id="discTbl"></table></div>
  </div>
  <div class="card">
    <div class="card-hd"><span class="card-nm">📅 Year Summary</span></div>
    <div class="twrap"><table class="t" id="yearTbl"></table></div>
  </div>
</div>

<!-- DEBT -->
<div class="page" id="page-debt">
  <div class="pg-head">

const SK="dojo_v6";
let _d=null,_sha=null;
function load(){if(_d)return _d;try{_d=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){_d={}}return _d;}
function persist(d){_d=d;localStorage.setItem(SK,JSON.stringify(d));}
function gm(k){const a=load();if(a[k])return a[k];if(HIST[k])return JSON.parse(JSON.stringify(HIST[k]));return{inc:{},exp:{}};}
function debtOpen(){const a=load();return Object.assign({},DEF_DEBT,a.__loans||{});}
function debtNames(){return Object.keys(debtOpen());}
function seed(){const a=load();let c=false;for(const[k,v] of Object.entries(HIST)){if(!a[k]){a[k]=JSON.parse(JSON.stringify(v));c=true;}}if(c)persist(a);}

async function syncGH(){
  try{
    setTag('syncing…','var(--stone-400)');
    const r=await fetch('/api/save');if(!r.ok)throw 0;
    const{data,sha}=await r.json();_sha=sha;
    persist(Object.assign({},load(),data));rerender();
    setTag('✓ synced','var(--forest)');
  }catch(e){setTag('offline','var(--amber)');}
}
async function pushGH(d){
  if(!_sha){try{const r=await fetch('/api/save');if(r.ok){const j=await r.json();_sha=j.sha;}}catch(e){}}
  if(!_sha){setTag('local only','var(--amber)');return;}
  try{
    setTag('saving…','var(--stone-400)');
    const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d,sha:_sha})});
    if(!r.ok)throw 0;
    try{const r2=await fetch('/api/save');if(r2.ok){const j=await r2.json();_sha=j.sha;}}catch(e){}
    setTag('✓ saved','var(--forest)');
  }catch(e){setTag('local only','var(--amber)');}
}
function setTag(t,c){const el=document.getElementById('syncTag');if(el){el.textContent=t;el.style.color=c;}}

// CALC
// ══════════════════════════════════════════
function cTot(d,s,c){return Object.values(d[s]?.[c]||{}).reduce((a,v)=>a+(+v||0),0);}
function sTot(d,s,st){return st.reduce((a,{cat})=>a+cTot(d,s,cat),0);}
function sum(k){
  const d=gm(k);
  const inc=sTot(d,'inc',INC_S),exp=sTot(d,'exp',EXP_S);
  const bc={},bd={};
  EXP_S.forEach(({cat})=>{bc[cat]=cTot(d,'exp',cat);});
  INC_S.forEach(({cat})=>{bd[cat]=cTot(d,'inc',cat);});
  return{inc,exp,sav:inc-exp,bc,bd};
}
function debtRun(){
  const DO=debtOpen(),res={};
  for(const[n,o] of Object.entries(DO)){
    res[n]={};let b=o;
    for(const{key}of MONTHS_GEN){
      const d=gm(key),p=d.exp?.Debt?.[n]||0;
      b-=p;res[n][key]={p,b};
    }
  }
  return res;
}
function fmt(n){return'₹'+Math.abs(Math.round(n||0)).toLocaleString('en-IN');}
function fmtS(n){return(n<0?'−₹':'₹')+Math.abs(Math.round(n||0)).toLocaleString('en-IN');}
function sL(k){const m=MONTHS_GEN.find(x=>x.key===k);return`${m.label}'${String(m.year).slice(2)}`;}

function goPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active','enter'));
  document.querySelectorAll('.bni').forEach(b=>b.classList.remove('active'));
  const pg=document.getElementById('page-'+id);
  pg.classList.add('active');
  setTimeout(()=>pg.classList.add('enter'),10);
  if(btn)btn.classList.add('active');
  if(id==='dashboard')renderDash();
  if(id==='debt')renderDebt();
  window.scrollTo({top:0,behavior:'instant'});
}
function rerender(){
  const ap=document.querySelector('.page.active')?.id;
  if(ap==='page-entry')renderEntry();
  if(ap==='page-dashboard')renderDash();
  if(ap==='page-debt')renderDebt();
}

// ENTRY
// ══════════════════════════════════════════
let selK=CUR_KEY,draft={};

function initEntry(){
  const strip=document.getElementById('monthStrip');strip.innerHTML='';
  const a=load();
  const yrs={};MONTHS_GEN.forEach(m=>{(yrs[m.year]||=[]).push(m);});
  for(const[yr,ms]of Object.entries(yrs)){
    const g=document.createElement('div');g.className='yr-grp';
    const yl=document.createElement('div');yl.className='yr-tag';yl.textContent=yr;
    const yr2=document.createElement('div');yr2.className='yr-row';
    ms.forEach(({key,label})=>{
      const b=document.createElement('button');
      b.className='mpill'+(key===CUR_KEY?' cur':'')+(a[key]?' has-data':'');
      if(key===selK)b.classList.add('active');
      b.textContent=label;b.dataset.key=key;
      b.onclick=()=>pickMonth(key,b);
      yr2.appendChild(b);
    });
    g.appendChild(yl);g.appendChild(yr2);strip.appendChild(g);
  }
  setTimeout(()=>{const ac=strip.querySelector('.mpill.active');if(ac)ac.scrollIntoView({inline:'center',behavior:'smooth'});},120);
  renderEntry();
}

function pickMonth(k,btn){
  selK=k;draft={};
  document.querySelectorAll('.mpill').forEach(b=>b.classList.remove('active'));
  btn?.classList.add('active');
  renderEntry();
}

function renderEntry(){
  const grid=document.getElementById('entryGrid');grid.innerHTML='';
  const data=gm(selK);
  const dr=debtRun();
  const DO=debtOpen();
  EXP_S.find(s=>s.cat==='Debt').rows=debtNames();
  const prevI=MONTHS_GEN.findIndex(m=>m.key===selK)-1;
  const prevK=prevI>=0?MONTHS_GEN[prevI].key:null;

  // Wrapper for side-by-side layout
  const colWrap = document.createElement('div');
  colWrap.className = 'entry-cols';

  // Income
  const{s:is,b:ib}=mkSec('📥','Income','inc');
  INC_S.forEach(({cat,rows})=>{
    const cb=mkCatBlk(cat,`si-${cat}`,cTot(data,'inc',cat));
    rows.forEach(row=>{const v=data.inc?.[cat]?.[row]||'';cb.appendChild(mkRI(row,v,val=>{setD('inc',cat,row,val);refresh(data);}));});
    ib.appendChild(cb);
  });
  colWrap.appendChild(is);

  // Expenses
  const{s:es,b:eb}=mkSec('📤','Expenses','exp');
  EXP_S.filter(s=>s.cat!=='Debt').forEach(({cat,rows})=>{
    const cb=mkCatBlk(cat,`se-${cat}`,cTot(data,'exp',cat));
    rows.forEach(row=>{const v=data.exp?.[cat]?.[row]||'';cb.appendChild(mkRI(row,v,val=>{setD('exp',cat,row,val);refresh(data);}));});
    eb.appendChild(cb);
  });
  colWrap.appendChild(es);
  grid.appendChild(colWrap);

  // Debt
  const{s:ds,b:db}=mkSec('💳','Debt Payments','debt');
  const dcb=document.createElement('div');
  const dch=document.createElement('div');dch.className='cat-hd';
  dch.innerHTML='<span>Creditor</span><span>Balance remaining</span>';
  dcb.appendChild(dch);
  debtNames().forEach(name=>{
    const v=data.exp?.Debt?.[name]||'';
    const opening=DO[name]||0;
    const balBefore=prevK?(dr[name]?.[prevK]?.b??opening):opening;
    const cur=parseFloat(String(v).replace(/,/g,''))||0;
    const rem=balBefore-cur;
    const paidTotal=opening-balBefore+cur;
    const pct=opening>0?Math.min(Math.round(paidTotal/opening*100),100):0;

    const row=document.createElement('div');row.className='ri dri';
    const top=document.createElement('div');top.className='dri-top';
    const lbl=document.createElement('span');lbl.className='ri-lbl';lbl.textContent=name;
    const inp=mkInp(v,val=>{
      setD('exp','Debt',name,val);
      const nr=balBefore-(val||0);
      const np=opening>0?Math.min(Math.round((opening-balBefore+(val||0))/opening*100),100):0;
      const bt=document.getElementById(`dbf-${name}`);if(bt)bt.style.width=np+'%';
      const tt=document.getElementById(`dbt-${name}`);
      if(tt){tt.textContent=nr<=0?'Cleared! 🎉':fmt(nr)+' left';tt.className='dbal-txt'+(nr<=0?' done':'');}
      refresh(data);
    });
    top.appendChild(lbl);top.appendChild(inp);
    const balRow=document.createElement('div');balRow.className='dri-bal';
    const bg=document.createElement('div');bg.className='dbar-bg';
    const fill=document.createElement('div');fill.className='dbar-fill';fill.id=`dbf-${name}`;fill.style.width=pct+'%';
    bg.appendChild(fill);
    const txt=document.createElement('span');txt.className='dbal-txt'+(rem<=0?' done':'');txt.id=`dbt-${name}`;
    txt.textContent=rem<=0?'Cleared! 🎉':fmt(rem)+' left';
    balRow.appendChild(bg);balRow.appendChild(txt);
    row.appendChild(top);row.appendChild(balRow);
    dcb.appendChild(row);
  });
  db.appendChild(dcb);grid.appendChild(ds);
  setTimeout(()=>refresh(data),0);
}

function setD(s,c,i,v){if(!draft[s])draft[s]={};if(!draft[s][c])draft[s][c]={};draft[s][c][i]=v;}
function mkSec(ico,nm,k){
  const s=document.createElement('div');s.className='sec';
  const hd=document.createElement('div');hd.className='sec-hd';
  hd.innerHTML=`<div class="sec-hd-l"><span class="sec-ico">${ico}</span><span class="sec-nm">${nm}</span></div><div class="sec-r"><span class="sec-tot" id="st-${k}">₹0</span><span class="chev">▾</span></div>`;
  hd.onclick=()=>s.classList.toggle('col');
  const b=document.createElement('div');b.className='sec-bd';
  s.appendChild(hd);s.appendChild(b);return{s,b};
}
function mkCatBlk(lbl,id,val){
  const cb=document.createElement('div');
  const ch=document.createElement('div');ch.className='cat-hd';
  ch.innerHTML=`<span>${lbl}</span><span class="cat-sum" id="${id}">${fmt(val)}</span>`;
  cb.appendChild(ch);return cb;
}
function mkRI(lbl,val,onChange){
  const row=document.createElement('div');row.className='ri';
  const l=document.createElement('span');l.className='ri-lbl';l.textContent=lbl;
  row.appendChild(l);row.appendChild(mkInp(val,onChange));return row;
}
function mkInp(val,onChange){
  const inp=document.createElement('input');inp.className='inp'+(val?' filled':'');
  inp.type='text';inp.inputMode='numeric';inp.placeholder='0';
  inp.value=val?Number(val).toLocaleString('en-IN'):'';
  inp.onfocus=()=>{inp.value=inp.value.replace(/,/g,'');};
  inp.onblur=()=>{
    const n=parseFloat(inp.value.replace(/,/g,''))||0;
    inp.value=n?n.toLocaleString('en-IN'):'';
    inp.classList.toggle('filled',!!n);onChange(n||0);
  };
  inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};
  return inp;
}
function refresh(base){
  const m=JSON.parse(JSON.stringify(base));
  for(const s of['inc','exp']){if(draft[s])for(const[c,items]of Object.entries(draft[s])){if(!m[s])m[s]={};if(!m[s][c])m[s][c]={};Object.assign(m[s][c],items);}}
  INC_S.forEach(({cat})=>{const e=document.getElementById(`si-${cat}`);if(e)e.textContent=fmt(cTot(m,'inc',cat));});
  EXP_S.forEach(({cat})=>{const e=document.getElementById(`se-${cat}`);if(e)e.textContent=fmt(cTot(m,'exp',cat));});
  ['inc','exp','debt'].forEach(k=>{const e=document.getElementById(`st-${k}`);if(e){
    if(k==='inc')e.textContent=fmt(sTot(m,'inc',INC_S));
    else if(k==='exp')e.textContent=fmt(sTot(m,'exp',EXP_S.filter(s=>s.cat!=='Debt')));
    else e.textContent=fmt(cTot(m,'exp','Debt'));
  }});
}
function saveMonth(){
  if(!Object.keys(draft).length){flash();return;}
  const a=load(),ex=a[selK]||{inc:{},exp:{}};
  for(const s of['inc','exp']){if(draft[s])for(const[c,items]of Object.entries(draft[s])){if(!ex[s][c])ex[s][c]={};for(const[i,v]of Object.entries(items)){if(v)ex[s][c][i]=v;else delete ex[s][c][i];}}}
  a[selK]=ex;persist(a);draft={};
  document.querySelectorAll('.mpill').forEach(b=>{if(b.dataset.key===selK)b.classList.add('has-data');});
  flash();pushGH(a);
}
function flash(){const e=document.getElementById('savedMsg');e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2500);}

// ══════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════
let cMain=null,cDonut=null,cMainT='overview',cDonutT='all';

function renderDash(){
  const filled=MONTHS_GEN.filter(({key})=>{const s=sum(key);return s.inc>0||s.exp>0;});
  if(!filled.length)return;
  const ti=filled.reduce((a,{key})=>a+sum(key).inc,0);
  const te=filled.reduce((a,{key})=>a+sum(key).exp,0);
  const ts=ti-te,td=filled.reduce((a,{key})=>a+(sum(key).bc.Debt||0),0);

  document.getElementById('kpis').innerHTML=`
    <div class="kpi k1"><div class="kpi-lbl">Total Income</div><div class="kpi-val">${fmt(ti)}</div><div class="kpi-sub">${filled.length} months recorded</div></div>
    <div class="kpi k2"><div class="kpi-lbl">Total Expenses</div><div class="kpi-val">${fmt(te)}</div><div class="kpi-sub">all categories</div></div>
    <div class="kpi k3"><div class="kpi-lbl">Net Savings</div><div class="kpi-val ${ts>=0?'pos':'neg'}">${fmtS(ts)}</div><div class="kpi-sub">${ti>0?Math.round(ts/ti*100):0}% of income</div></div>
    <div class="kpi k4"><div class="kpi-lbl">Debt Repaid</div><div class="kpi-val amb">${fmt(td)}</div><div class="kpi-sub">total so far</div></div>`;

  drawMain(filled);drawDonut(filled);renderBudget(filled);renderDisc(filled);renderYear(filled);
}

const chartOpts={
  responsive:true,maintainAspectRatio:false,
  plugins:{legend:{labels:{color:'#7a7068',font:{family:'Plus Jakarta Sans',size:10},boxWidth:10,padding:8}}},
  scales:{
    x:{stacked:false,grid:{display:false},ticks:{color:'#a89f94',font:{size:9},maxRotation:0}},
    y:{stacked:false,grid:{color:'rgba(0,0,0,0.04)'},ticks:{color:'#a89f94',font:{size:9},callback:v=>{if(v>=100000)return'₹'+(v/100000).toFixed(1)+'L';if(v>=1000)return'₹'+(v/1000)+'k';return'₹'+v;}}},
  }
};

function drawMain(filled){
  if(cMain){cMain.destroy();cMain=null;}
  const ctx=document.getElementById('mainChart').getContext('2d');
  const labels=filled.map(({key})=>sL(key));
  let ds=[];
  if(cMainT==='overview'){
    ds=[
      {label:'Income',  data:filled.map(({key})=>sum(key).inc), backgroundColor:'rgba(61,107,85,0.75)',  borderRadius:3},
      {label:'Expenses',data:filled.map(({key})=>sum(key).exp), backgroundColor:'rgba(224,112,85,0.75)', borderRadius:3},
      {label:'Savings', data:filled.map(({key})=>sum(key).sav), backgroundColor:filled.map(({key})=>sum(key).sav>=0?'rgba(61,107,85,0.5)':'rgba(224,112,85,0.5)'), borderRadius:3},
    ];
  }else if(cMainT==='discipline'){
    ds=INC_S.map(({cat},i)=>({label:cat,data:filled.map(({key})=>sum(key).bd[cat]||0),backgroundColor:PALETTE[i%PALETTE.length]+'CC',borderRadius:3}));
  }else{
    ds=EXP_S.map(({cat},i)=>({label:cat,data:filled.map(({key})=>sum(key).bc[cat]||0),backgroundColor:PALETTE[i%PALETTE.length]+'CC',borderRadius:3}));
  }
  const opts=JSON.parse(JSON.stringify(chartOpts));
  opts.scales.x.stacked=cMainT!=='overview';
  opts.scales.y.stacked=cMainT!=='overview';
  cMain=new Chart(ctx,{type:'bar',data:{labels,datasets:ds},options:opts});
}

function drawDonut(filled){
  if(cDonut){cDonut.destroy();cDonut=null;}
  const ctx=document.getElementById('donutChart').getContext('2d');
  const recent=filled[filled.length-1];
  const data=EXP_S.map(({cat})=>cDonutT==='all'?filled.reduce((a,{key})=>a+(sum(key).bc[cat]||0),0):(sum(recent.key).bc[cat]||0));
  cDonut=new Chart(ctx,{type:'doughnut',
    data:{labels:EXP_S.map(s=>s.cat),datasets:[{data,backgroundColor:PALETTE.map(c=>c+'DD'),borderWidth:3,borderColor:'#ffffff',hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',
      plugins:{legend:{position:'bottom',labels:{color:'#7a7068',font:{family:'Plus Jakarta Sans',size:10},padding:8,boxWidth:10}}}}
  });
}

function renderBudget(filled){
  const rec=filled[filled.length-1],rs=sum(rec.key);
  const m=MONTHS_GEN.find(x=>x.key===rec.key);
  document.getElementById('budgetNm').textContent=`💰 Budget — ${m.label} ${m.year}`;
  const wrap=document.getElementById('budgetWrap');wrap.innerHTML='';
  BUDGET.forEach(({nm,pct,cats,isSav})=>{
    let act=0;if(isSav)act=rs.sav;else if(cats)cats.forEach(c=>{act+=(rs.bc[c]||0);});
    const tgt=rs.inc*pct,ratio=tgt>0?act/tgt:0;
    const cls=ratio<=1.05?'ok':ratio<=1.25?'warn':'over';
    const bw=Math.min(Math.abs(ratio)*100,100);
    const d=document.createElement('div');d.className='bi';
    d.innerHTML=`<div class="bi-top"><span class="bi-nm">${nm}</span><span class="bi-st ${cls}">${Math.round(ratio*100)}%</span></div><div class="bi-bar"><div class="bi-fill ${cls}" style="width:${bw}%"></div></div><div class="bi-amts"><span>${fmt(act)}</span><span>target ${fmt(tgt)}</span></div>`;
    wrap.appendChild(d);
  });
}

function renderDisc(filled){
  const t=document.getElementById('discTbl');
  const ls=filled.map(({key})=>sL(key));
  t.innerHTML=`<thead><tr><th>Discipline</th>${ls.map(l=>`<th>${l}</th>`).join('')}<th>Total</th></tr></thead>`;
  const tb=document.createElement('tbody');
  INC_S.forEach(({cat})=>{
    const vals=filled.map(({key})=>sum(key).bd[cat]||0);
    const tot=vals.reduce((a,v)=>a+v,0);if(!tot)return;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${cat}</td>${vals.map(v=>`<td class="${v?'dim':'mut'}">${v?fmt(v):'-'}</td>`).join('')}<td><b>${fmt(tot)}</b></td>`;
    tb.appendChild(tr);
  });
  const tot=document.createElement('tr');tot.className='tot';
  const ts=filled.map(({key})=>sum(key).inc);
  tot.innerHTML=`<td>Total</td>${ts.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${fmt(ts.reduce((a,v)=>a+v,0))}</td>`;
  tb.appendChild(tot);t.appendChild(tb);
}

function renderYear(filled){
  const t=document.getElementById('yearTbl');
  t.innerHTML=`<thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Savings</th><th>%</th></tr></thead>`;
  const tb=document.createElement('tbody');
  filled.forEach(({key})=>{
    const s=sum(key),m=MONTHS_GEN.find(x=>x.key===key);
    const pct=s.inc>0?Math.round(s.sav/s.inc*100):0;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${m.label} ${m.year}</td><td class="dim">${fmt(s.inc)}</td><td class="dim">${fmt(s.exp)}</td><td class="${s.sav>=0?'pos':'neg'}">${fmtS(s.sav)}</td><td class="${pct>=0?'pos':'neg'}">${pct}%</td>`;
    tb.appendChild(tr);
  });
  const tot=document.createElement('tr');tot.className='tot';
  const ti=filled.reduce((a,{key})=>a+sum(key).inc,0);
  const te=filled.reduce((a,{key})=>a+sum(key).exp,0),ts=ti-te;
  const tp=ti>0?Math.round(ts/ti*100):0;
  tot.innerHTML=`<td>Total</td><td>${fmt(ti)}</td><td>${fmt(te)}</td><td class="${ts>=0?'pos':'neg'}">${fmtS(ts)}</td><td class="${tp>=0?'pos':'neg'}">${tp}%</td>`;
  tb.appendChild(tot);t.appendChild(tb);
}

function switchMain(t,btn){
  cMainT=t;
  document.querySelectorAll('#page-dashboard .chart-card:nth-child(1) .ctab').forEach(b=>b.classList.remove('on'));
  btn?.classList.add('on');
  drawMain(MONTHS_GEN.filter(({key})=>{const s=sum(key);return s.inc>0||s.exp>0;}));
}
function switchDonut(t,btn){
  cDonutT=t;
  document.querySelectorAll('#page-dashboard .chart-card:nth-child(2) .ctab').forEach(b=>b.classList.remove('on'));
  btn?.classList.add('on');
  drawDonut(MONTHS_GEN.filter(({key})=>{const s=sum(key);return s.inc>0||s.exp>0;}));
}

// ══════════════════════════════════════════
// DEBT
// ══════════════════════════════════════════
function renderDebt(){
  const dr=debtRun(),DO=debtOpen();
  const filled=MONTHS_GEN.filter(({key})=>{const s=sum(key);return s.inc>0||s.exp>0;});
  const lastK=filled.length?filled[filled.length-1].key:MONTHS_GEN[0].key;
  const grid=document.getElementById('debtGrid');grid.innerHTML='';
  for(const[nm,op]of Object.entries(DO)){
    const rem=dr[nm]?.[lastK]?.b??op;
    const paid=op-rem,pct=op>0?Math.min(Math.round(paid/op*100),100):0;
    const c=document.createElement('div');c.className='dc';
    c.innerHTML=`<div class="dc-nm">${nm}</div><div class="dc-rem ${rem<=0?'done':''}">${rem<=0?'Cleared! 🎉':fmt(rem)}</div><div class="dc-prog"><div class="dc-fill" style="width:${pct}%"></div></div><div class="dc-sub"><span>${pct}% paid</span><span>${fmt(paid)} paid</span></div>`;
    grid.appendChild(c);
  }
  const t=document.getElementById('debtTbl');
  const ls=filled.map(({key})=>sL(key));
  t.innerHTML=`<thead><tr><th>Creditor</th><th>Opening</th>${ls.map(l=>`<th>${l}</th>`).join('')}</tr></thead>`;
  const tb=document.createElement('tbody');
  for(const[nm,op]of Object.entries(DO)){
    const tr=document.createElement('tr');
    const cells=filled.map(({key})=>{const b=dr[nm]?.[key]?.b??op,p=dr[nm]?.[key]?.p||0;return`<td class="${b<=0?'pos':p>0?'':'mut'}">${b<=0?'✓':fmt(b)}</td>`;}).join('');
    tr.innerHTML=`<td>${nm}</td><td class="mut">${fmt(op)}</td>${cells}`;
    tb.appendChild(tr);
  }
  t.appendChild(tb);
}

// ══════════════════════════════════════════
// ADD LOAN
// ══════════════════════════════════════════
function openModal(){document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');document.getElementById('loanName').value='';document.getElementById('loanAmt').value='';}
function bgClose(e){if(e.target===document.getElementById('overlay'))closeModal();}
function addLoan(){
  const nm=document.getElementById('loanName').value.trim();
  const amt=parseFloat(document.getElementById('loanAmt').value)||0;
  if(!nm){document.getElementById('loanName').focus();return;}
  if(amt<=0){document.getElementById('loanAmt').focus();return;}
  const a=load();if(!a.__loans)a.__loans={};
  a.__loans[nm]=amt;persist(a);closeModal();
  renderDebt();pushGH(a);
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
seed();initEntry();syncGH();
</script>
