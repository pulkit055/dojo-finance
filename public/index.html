<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dojo Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Warm sage-and-cream light theme — easy on the eyes */
  --bg:       #f4f1ec;
  --bg2:      #fffdf9;
  --bg3:      #eee9e1;
  --border:   rgba(0,0,0,0.08);
  --border2:  rgba(0,0,0,0.14);
  --text:     #2d2a24;
  --text2:    #6b6560;
  --text3:    #a39e97;
  --sage:     #5c7a6a;
  --sage2:    #3d5c4e;
  --sage-dim: rgba(92,122,106,0.12);
  --terracotta:#c4664a;
  --terra-dim: rgba(196,102,74,0.12);
  --gold:     #c49a3c;
  --gold-dim: rgba(196,154,60,0.12);
  --sky:      #4a7fa5;
  --sky-dim:  rgba(74,127,165,0.12);
  --green:    #4a8c5c;
  --green-dim:rgba(74,140,92,0.12);
  --red:      #b85450;
  --red-dim:  rgba(184,84,80,0.12);
  --shadow:   0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg:0 4px 24px rgba(0,0,0,0.12);
  --r:        14px;
  --r-sm:     8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{background:var(--bg);color:var(--text);font-family:'Nunito Sans',sans-serif;min-height:100vh;overflow-x:hidden;}

/* ── BOTTOM NAV (mobile-first) ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;height:64px;
  box-shadow:0 -2px 16px rgba(0,0,0,0.08);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;border:none;background:transparent;
  cursor:pointer;transition:all 0.15s;padding:8px 4px;
}
.bn-item .icon{font-size:22px;line-height:1;}
.bn-item .label{font-size:10px;font-weight:600;color:var(--text3);font-family:'Nunito',sans-serif;letter-spacing:0.3px;}
.bn-item.active .label{color:var(--sage2);}
.bn-item.active .icon{transform:translateY(-2px);}
.bn-item:active{background:var(--bg3);}

/* ── PAGES ── */
.page{display:none;padding:16px 16px 88px;max-width:860px;margin:0 auto;}
.page.active{display:block;animation:fadeUp 0.2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── TOP BAR ── */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;padding-top:8px;
}
.page-title{font-family:'Nunito',sans-serif;font-size:24px;font-weight:800;color:var(--text);letter-spacing:-0.3px;}
.page-title span{color:var(--sage);}
.sync-pill{
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;
  background:var(--sage-dim);color:var(--sage2);border:1px solid rgba(92,122,106,0.25);
  font-family:'Nunito',sans-serif;
}

/* ── MONTH SELECTOR ── */
.month-scroll{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.month-scroll::-webkit-scrollbar{display:none;}
.year-group{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.year-label{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;padding-left:2px;}
.year-pills{display:flex;gap:4px;}
.mp{
  padding:8px 14px;border-radius:20px;border:1.5px solid var(--border2);
  background:var(--bg2);font-size:13px;font-weight:700;
  color:var(--text2);cursor:pointer;transition:all 0.14s;
  font-family:'Nunito',sans-serif;flex-shrink:0;white-space:nowrap;
  position:relative;
}
.mp:active{transform:scale(0.96);}
.mp.active{background:var(--sage);border-color:var(--sage);color:white;box-shadow:0 2px 8px rgba(92,122,106,0.3);}
.mp.cur{border-color:var(--terracotta);color:var(--terracotta);}
.mp.cur.active{background:var(--terracotta);border-color:var(--terracotta);color:white;box-shadow:0 2px 8px rgba(196,102,74,0.3);}
.mp.has-data::after{content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--green);}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);}
.card+.card{margin-top:12px;}
.card-head{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.card-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--text);}
.card-total{font-size:14px;font-weight:700;color:var(--text2);}

/* ── ENTRY SECTIONS ── */
.sec-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;}
.sec-head{
  padding:16px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.sec-head:active{background:var(--bg3);}
.sec-head-l{display:flex;align-items:center;gap:10px;}
.sec-icon{font-size:20px;}
.sec-label{font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;}
.sec-right{display:flex;align-items:center;gap:8px;}
.sec-total{font-size:14px;font-weight:700;color:var(--text2);}
.sec-chev{font-size:14px;color:var(--text3);transition:transform 0.2s;}
.sec-card.col .sec-chev{transform:rotate(-90deg);}
.sec-card.col .sec-body{display:none;}
.sec-body{border-top:1px solid var(--border);}

.cat-head{
  padding:10px 16px 10px 24px;
  font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;
  color:var(--text3);background:var(--bg3);
  display:flex;align-items:center;justify-content:space-between;
}
.cat-sub{font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;}

.row-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 10px 28px;
  border-bottom:1px solid var(--border);
  gap:10px;
}
.row-item:last-child{border-bottom:none;}
.row-lbl{font-size:14px;color:var(--text2);flex:1;line-height:1.3;}
.row-inp{
  width:120px;padding:8px 12px;
  background:var(--bg3);border:1.5px solid var(--border2);
  border-radius:var(--r-sm);color:var(--text);
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;
  text-align:right;outline:none;transition:all 0.15s;
  -webkit-appearance:none;
}
.row-inp:focus{border-color:var(--sage);background:var(--sage-dim);}
.row-inp.filled{border-color:rgba(74,140,92,0.4);background:var(--green-dim);}
.row-inp::placeholder{color:var(--text3);font-weight:400;}

/* Debt row */
.row-item.debt-row{flex-wrap:wrap;gap:8px;padding:12px 16px 12px 28px;}
.debt-row-top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;}
.debt-bal-wrap{width:100%;display:flex;align-items:center;gap:8px;}
.debt-bar-bg{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;}
.debt-bar-fill{height:100%;border-radius:3px;background:var(--green);transition:width 0.4s ease;}
.debt-bal-text{font-size:12px;font-weight:700;color:var(--red);white-space:nowrap;font-family:'Nunito',sans-serif;}
.debt-bal-text.cleared{color:var(--green);}

/* ── SAVE BAR ── */
.save-bar{
  position:sticky;bottom:64px;z-index:10;
  padding:12px 0 4px;
  background:linear-gradient(to top,var(--bg) 60%,transparent);
  display:flex;gap:10px;align-items:center;
}
.btn-primary{
  flex:1;padding:14px;background:var(--sage);color:white;
  border:none;border-radius:var(--r);
  font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;
  cursor:pointer;transition:all 0.15s;box-shadow:0 3px 12px rgba(92,122,106,0.35);
}
.btn-primary:active{transform:scale(0.98);background:var(--sage2);}
.save-msg{font-size:13px;font-weight:700;color:var(--green);opacity:0;transition:opacity 0.3s;white-space:nowrap;}
.save-msg.show{opacity:1;}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.kpi{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.kpi.k1::before{background:var(--sage);}
.kpi.k2::before{background:var(--terracotta);}
.kpi.k3::before{background:var(--green);}
.kpi.k4::before{background:var(--gold);}
.kpi-lbl{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.kpi-val{font-family:'Nunito',sans-serif;font-size:18px;font-weight:800;line-height:1;}
.kpi-val.pos{color:var(--green);}
.kpi-val.neg{color:var(--red);}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px;}

/* ── CHARTS ── */
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.chart-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.chart-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:var(--text);}
.chart-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.ct{
  padding:5px 11px;border-radius:20px;border:1.5px solid var(--border2);
  background:transparent;font-size:11px;font-weight:700;color:var(--text2);
  cursor:pointer;font-family:'Nunito',sans-serif;transition:all 0.14s;
}
.ct.active{background:var(--sage);border-color:var(--sage);color:white;}
.ct:active{transform:scale(0.96);}

/* ── BUDGET ── */
.budget-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px;}
.bitem{background:var(--bg3);border-radius:var(--r-sm);padding:12px;}
.bitem-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.bitem-name{font-size:12px;font-weight:700;color:var(--text2);}
.bitem-status{font-size:11px;font-weight:700;}
.bitem-status.ok{color:var(--green);}
.bitem-status.warn{color:var(--gold);}
.bitem-status.over{color:var(--red);}
.bbar{height:5px;background:rgba(0,0,0,0.08);border-radius:3px;overflow:hidden;margin-bottom:5px;}
.bbar-fill{height:100%;border-radius:3px;transition:width 0.5s;}
.bbar-fill.ok{background:var(--green);}
.bbar-fill.warn{background:var(--gold);}
.bbar-fill.over{background:var(--red);}
.bitem-amts{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);font-weight:600;}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.ft{width:100%;border-collapse:collapse;font-size:12px;}
table.ft th{
  padding:9px 12px;font-size:10px;font-weight:700;letter-spacing:0.6px;
  text-transform:uppercase;color:var(--text3);text-align:right;
  border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg3);
}
table.ft th:first-child{text-align:left;}
table.ft td{
  padding:9px 12px;text-align:right;
  border-bottom:1px solid rgba(0,0,0,0.04);white-space:nowrap;
  font-weight:600;color:var(--text2);
}
table.ft td:first-child{text-align:left;color:var(--text);font-weight:700;}
table.ft tr:last-child td{border-bottom:none;}
table.ft tr.tot td{font-weight:800;border-top:2px solid var(--border);color:var(--text);background:var(--bg3);}
table.ft tr:hover:not(.tot) td{background:var(--bg3);}
td.pos{color:var(--green)!important;}
td.neg{color:var(--red)!important;}
td.muted{color:var(--text3)!important;}

/* ── DEBT PAGE ── */
.debt-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.debt-sum-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;box-shadow:var(--shadow);
}
.dscard-name{font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;margin-bottom:4px;}
.dscard-rem{font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:var(--red);margin-bottom:6px;}
.dscard-rem.cleared{color:var(--green);}
.dprog{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:6px;}
.dprog-fill{height:100%;border-radius:3px;background:var(--green);transition:width 0.5s;}
.dscard-sub{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--text3);}

/* ── ADD LOAN MODAL ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.25s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--bg2);border-radius:var(--r) var(--r) 0 0;
  padding:24px 20px 40px;width:100%;max-width:520px;
  transform:translateY(100%);transition:transform 0.3s ease;
  box-shadow:0 -4px 24px rgba(0,0,0,0.15);
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-title{font-family:'Nunito',sans-serif;font-size:18px;font-weight:800;margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:20px;}
.modal-field{margin-bottom:14px;}
.modal-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;display:block;}
.modal-input{
  width:100%;padding:12px 14px;background:var(--bg3);
  border:1.5px solid var(--border2);border-radius:var(--r-sm);
  font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;
  color:var(--text);outline:none;transition:border-color 0.15s;
}
.modal-input:focus{border-color:var(--sage);}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.btn-secondary{
  flex:1;padding:13px;background:var(--bg3);color:var(--text2);
  border:1.5px solid var(--border2);border-radius:var(--r);
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
}
.btn-danger{
  padding:13px 20px;background:var(--red-dim);color:var(--red);
  border:1.5px solid rgba(184,84,80,0.3);border-radius:var(--r);
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
}

/* ── ADD BUTTON ── */
.add-btn{
  display:flex;align-items:center;gap:6px;padding:8px 14px;
  background:var(--sage-dim);color:var(--sage2);
  border:1.5px solid rgba(92,122,106,0.3);border-radius:20px;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;
}
.add-btn:active{transform:scale(0.97);}

/* ── HISTORY TOGGLE ── */
.hist-toggle{
  display:flex;align-items:center;gap:6px;padding:8px 16px;
  font-size:12px;font-weight:700;color:var(--sky);
  background:none;border:none;cursor:pointer;width:100%;
}
.hist-body{display:none;padding:0 16px 12px;}
.hist-body.open{display:block;}
.hist-row{
  display:flex;justify-content:space-between;
  padding:6px 0;border-bottom:1px solid var(--border);
  font-size:12px;font-weight:600;
}
.hist-row:last-child{border-bottom:none;}
.hist-mo{color:var(--text2);}
.hist-amt{color:var(--green);}

@media(min-width:600px){
  .kpi-grid{grid-template-columns:repeat(4,1fr);}
  .debt-summary-grid{grid-template-columns:repeat(3,1fr);}
  .budget-grid{grid-template-columns:repeat(3,1fr);}
  .page{padding:20px 24px 88px;}
}
</style>
</head>
<body>

<!-- ENTRY PAGE -->
<div class="page active" id="page-entry">
  <div class="top-bar">
    <div class="page-title">Monthly <span>Entry</span></div>
    <span class="sync-pill" id="syncBadge">—</span>
  </div>
  <div class="month-scroll" id="monthScroll"></div>
  <div id="entryGrid"></div>
  <div class="save-bar">
    <button class="btn-primary" onclick="saveMonth()">💾  Save Month</button>
    <span class="save-msg" id="saveMsg">✓ Saved!</span>
  </div>
</div>

<!-- DASHBOARD PAGE -->
<div class="page" id="page-dashboard">
  <div class="top-bar"><div class="page-title">Dashboard</div></div>
  <div class="kpi-grid" id="kpiGrid"></div>
  <div class="chart-card">
    <div class="chart-top">
      <span class="chart-title">Monthly Trend</span>
      <div class="chart-tabs">
        <button class="ct active" onclick="switchChart('overview',this)">Overview</button>
        <button class="ct" onclick="switchChart('discipline',this)">Discipline</button>
        <button class="ct" onclick="switchChart('category',this)">Category</button>
      </div>
    </div>
    <canvas id="mainChart"></canvas>
  </div>
  <div class="chart-card">
    <div class="chart-top">
      <span class="chart-title">Expense Breakdown</span>
      <div class="chart-tabs">
        <button class="ct active" onclick="switchDonut('all',this)">All time</button>
        <button class="ct" onclick="switchDonut('month',this)">This month</button>
      </div>
    </div>
    <canvas id="donutChart"></canvas>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-head"><span class="card-title" id="budgetLabel">💰 Budget Allocation</span></div>
    <div class="budget-grid" id="budgetGrid"></div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-head"><span class="card-title">🥋 Income by Discipline</span></div>
    <div class="tbl-wrap"><table class="ft" id="discTable"></table></div>
  </div>
  <div class="card">
    <div class="card-head"><span class="card-title">📅 Full Year Summary</span></div>
    <div class="tbl-wrap"><table class="ft" id="yearTable"></table></div>
  </div>
</div>

<!-- DEBT PAGE -->
<div class="page" id="page-debt">
  <div class="top-bar">
    <div class="page-title">Debt <span style="color:var(--red)">Tracker</span></div>
    <button class="add-btn" onclick="openAddLoan()">＋ Add Loan</button>
  </div>
  <div class="debt-summary-grid" id="debtSummaryGrid"></div>
  <div class="card">
    <div class="card-head"><span class="card-title">📊 Running Balance</span></div>
    <div class="tbl-wrap"><table class="ft" id="debtRunTable"></table></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="bn-item active" id="bn-entry" onclick="showPage('entry',this)">
    <span class="icon">📝</span><span class="label">Entry</span>
  </button>
  <button class="bn-item" id="bn-dashboard" onclick="showPage('dashboard',this)">
    <span class="icon">📊</span><span class="label">Dashboard</span>
  </button>
  <button class="bn-item" id="bn-debt" onclick="showPage('debt',this)">
    <span class="icon">💳</span><span class="label">Debt</span>
  </button>
</nav>

<!-- ADD LOAN MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalIfBg(event)">
  <div class="modal">
    <div class="modal-title">Add New Loan</div>
    <div class="modal-sub">Enter the person or institution name and the opening balance.</div>
    <div class="modal-field">
      <label class="modal-label">Creditor Name</label>
      <input class="modal-input" id="newLoanName" placeholder="e.g. Rajan, Bank of India" />
    </div>
    <div class="modal-field">
      <label class="modal-label">Opening Balance (₹)</label>
      <input class="modal-input" id="newLoanAmt" type="number" placeholder="e.g. 50000" inputmode="numeric" />
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" style="flex:2" onclick="addLoan()">Add Loan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ══════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════
function genMonths(){
  const out=[];
  [{y:2025,months:["Sep","Oct","Nov","Dec"]},
   {y:2026,months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]},
   {y:2027,months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]}
  ].forEach(({y,months})=>months.forEach(m=>out.push({key:`${m}-${y}`,label:m,year:y})));
  return out;
}
const ALL_MONTHS=genMonths();

function curMonthKey(){
  const now=new Date();

const SK="dojo_v5";
let _cache=null,_sha=null;

function loadAll(){if(_cache)return _cache;try{_cache=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){_cache={}}return _cache;}
function saveAll(d){_cache=d;localStorage.setItem(SK,JSON.stringify(d));}
function getMonth(key){const a=loadAll();if(a[key])return a[key];if(HIST[key])return JSON.parse(JSON.stringify(HIST[key]));return{inc:{},exp:{}};}

function getDebtOpen(){
  const a=loadAll();
  const custom=a.__loans||{};
  return Object.assign({},DEFAULT_DEBT_OPEN,custom);
}
function getDebtNames(){return Object.keys(getDebtOpen());}

function seedHistory(){
  const a=loadAll();let ch=false;
  for(const[k,v] of Object.entries(HIST)){if(!a[k]){a[k]=JSON.parse(JSON.stringify(v));ch=true;}}
  if(ch)saveAll(a);
}

async function syncFromGitHub(){
  try{
    setSyncBadge('syncing…','var(--text3)');
    const r=await fetch('/api/save');if(!r.ok)throw new Error();
    const{data,sha}=await r.json();_sha=sha;
    const local=loadAll();saveAll(Object.assign({},local,data));
    rerender();setSyncBadge('✓ synced','var(--green)');
  }catch(e){setSyncBadge('offline','var(--terracotta)');}
}
async function pushToGitHub(data){
  if(!_sha){try{const r=await fetch('/api/save');if(r.ok){const j=await r.json();_sha=j.sha;}}catch(e){}}
  if(!_sha){setSyncBadge('saved locally','var(--terracotta)');return;}
  try{
    setSyncBadge('saving…','var(--text3)');
    const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data,sha:_sha})});
    if(!r.ok)throw new Error();
    try{const r2=await fetch('/api/save');if(r2.ok){const j=await r2.json();_sha=j.sha;}}catch(e){}
    setSyncBadge('✓ saved','var(--green)');
  }catch(e){setSyncBadge('saved locally','var(--terracotta)');}
}
function setSyncBadge(t,c){const el=document.getElementById('syncBadge');el.textContent=t;el.style.background=c==='var(--green)'?'rgba(74,140,92,0.12)':'rgba(196,102,74,0.12)';el.style.color=c==='var(--green)'?'var(--green)':'var(--terracotta)';}

function catTot(d,sec,cat){return Object.values(d[sec]?.[cat]||{}).reduce((s,v)=>s+(+v||0),0);}
function secTot(d,sec,struct){return struct.reduce((s,{cat})=>s+catTot(d,sec,cat),0);}
function mSum(key){
  const d=getMonth(key);
  const inc=secTot(d,'inc',INC_STRUCT);
  const exp=secTot(d,'exp',EXP_STRUCT);
  const byCat={},byDisc={};
  EXP_STRUCT.forEach(({cat})=>{byCat[cat]=catTot(d,'exp',cat);});
  INC_STRUCT.forEach(({cat})=>{byDisc[cat]=catTot(d,'inc',cat);});
  return{inc,exp,sav:inc-exp,byCat,byDisc};
}
function debtRunning(){
  const DEBT_OPEN=getDebtOpen();
  const res={};
  for(const[name,opening] of Object.entries(DEBT_OPEN)){
    res[name]={};let bal=opening;
    for(const{key} of ALL_MONTHS){
      const d=getMonth(key);
      const payment=d.exp?.['Debt']?.[name]||0;
      bal-=payment;
      res[name][key]={payment,balance:bal};
    }
  }
  return res;
}
function fmt(n){return'₹'+Math.abs(Math.round(n||0)).toLocaleString('en-IN');}
function fmtS(n){return(n<0?'−₹':'₹')+Math.abs(Math.round(n||0)).toLocaleString('en-IN');}

  if(id==='debt')renderDebt();

}

  const ap=document.querySelector('.page.active')?.id;
  if(ap==='page-entry')renderEntry();
  if(ap==='page-dashboard')renderDashboard();
  if(ap==='page-debt')renderDebt();
}

let selKey=CUR_KEY,draft={};

function initEntry(){
  const scroll=document.getElementById('monthScroll');
  scroll.innerHTML='';
  const all=loadAll();
  const years={};
  ALL_MONTHS.forEach(m=>{(years[m.year]||=[]).push(m);});
  for(const[yr,months] of Object.entries(years)){
    const grp=document.createElement('div');grp.className='year-group';
    const yl=document.createElement('div');yl.className='year-label';yl.textContent=yr;
    const yp=document.createElement('div');yp.className='year-pills';
    months.forEach(({key,label})=>{
      const btn=document.createElement('button');
      btn.className='mp'+(key===CUR_KEY?' cur':'')+(all[key]?' has-data':'');
      if(key===selKey)btn.classList.add('active');
      btn.textContent=label;btn.dataset.key=key;
      btn.onclick=()=>selectMonth(key,btn);
      yp.appendChild(btn);
    });
    grp.appendChild(yl);grp.appendChild(yp);scroll.appendChild(grp);
  }
  // Scroll to current month
  setTimeout(()=>{
    const active=scroll.querySelector('.mp.active');
    if(active)active.scrollIntoView({inline:'center',behavior:'smooth'});
  },100);
  renderEntry();
}

function selectMonth(key,btn){
  selKey=key;draft={};
  document.querySelectorAll('.mp').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderEntry();
}

function renderEntry(){
  const grid=document.getElementById('entryGrid');grid.innerHTML='';
  const data=getMonth(selKey);
  const dr=debtRunning();
  const DEBT_OPEN=getDebtOpen();
  const debtNames=getDebtNames();

  // Dynamic EXP_STRUCT debt items
  EXP_STRUCT.find(s=>s.cat==='Debt').items=debtNames;

  const prevIdx=ALL_MONTHS.findIndex(m=>m.key===selKey)-1;
  const prevKey=prevIdx>=0?ALL_MONTHS[prevIdx].key:null;

  // INCOME
  const{card:ic,body:ib}=mkSec('📥','Income','inc');
  INC_STRUCT.forEach(({cat,items})=>{
    const cb=mkCatBlock(cat,`si-${cat}`,catTot(data,'inc',cat));
    items.forEach(item=>{
      const v=data.inc?.[cat]?.[item]||'';
      cb.appendChild(mkRow(item,v,(val)=>{
        setDraft('inc',cat,item,val);refreshTotals(data);
      }));
    });
    ib.appendChild(cb);
  });
  grid.appendChild(ic);

  // EXPENSES (non-debt)
  const{card:ec,body:eb}=mkSec('📤','Expenses','exp');
  EXP_STRUCT.filter(s=>s.cat!=='Debt').forEach(({cat,items})=>{
    const cb=mkCatBlock(cat,`se-${cat}`,catTot(data,'exp',cat));
    items.forEach(item=>{
      const v=data.exp?.[cat]?.[item]||'';
      cb.appendChild(mkRow(item,v,(val)=>{setDraft('exp',cat,item,val);refreshTotals(data);}));
    });
    eb.appendChild(cb);
  });
  grid.appendChild(ec);

  // DEBT — special section
  const{card:dc,body:db}=mkSec('💳','Debt Payments','debt');
  const debtCb=document.createElement('div');
  const debtHeader=document.createElement('div');debtHeader.className='cat-head';
  debtHeader.innerHTML='<span>Creditor</span><span>Balance after payment</span>';
  debtCb.appendChild(debtHeader);

  debtNames.forEach(name=>{
    const v=data.exp?.['Debt']?.[name]||'';
    const opening=DEBT_OPEN[name]||0;
    const balBefore=prevKey?(dr[name]?.[prevKey]?.balance??opening):opening;
    const currentPaid=parseFloat(String(v).replace(/,/g,''))||0;
    const remaining=balBefore-currentPaid;

    const row=document.createElement('div');row.className='row-item debt-row';
    const top=document.createElement('div');top.className='debt-row-top';
    const lbl=document.createElement('span');lbl.className='row-lbl';lbl.textContent=name;
    const inp=mkInpEl(v,(val)=>{
      setDraft('exp','Debt',name,val);
      const newRem=balBefore-(val||0);
      updateDebtDisplay(name,newRem,opening);
      refreshTotals(data);
    });
    top.appendChild(lbl);top.appendChild(inp);

    const balWrap=document.createElement('div');balWrap.className='debt-bal-wrap';
    const barBg=document.createElement('div');barBg.className='debt-bar-bg';
    const barFill=document.createElement('div');barFill.className='debt-bar-fill';
    barFill.id=`dbf-${name}`;
    const paidSoFar=opening-balBefore+currentPaid;
    const pct=opening>0?Math.min(Math.round(paidSoFar/opening*100),100):0;
    barFill.style.width=pct+'%';
    barBg.appendChild(barFill);
    const balTxt=document.createElement('span');
    balTxt.className='debt-bal-text'+(remaining<=0?' cleared':'');
    balTxt.id=`dbt-${name}`;
    balTxt.textContent=remaining<=0?'Cleared! 🎉':fmt(remaining)+' left';
    balWrap.appendChild(barBg);balWrap.appendChild(balTxt);

    row.appendChild(top);row.appendChild(balWrap);
    debtCb.appendChild(row);
  });
  db.appendChild(debtCb);
  grid.appendChild(dc);
  setTimeout(()=>refreshTotals(data),0);
}

function updateDebtDisplay(name,remaining,opening){
  const txt=document.getElementById(`dbt-${name}`);
  const fill=document.getElementById(`dbf-${name}`);
  if(txt){txt.textContent=remaining<=0?'Cleared! 🎉':fmt(remaining)+' left';txt.className='debt-bal-text'+(remaining<=0?' cleared':'');}
  if(fill&&opening>0){const paid=opening-remaining;fill.style.width=Math.min(Math.round(paid/opening*100),100)+'%';}
}

function setDraft(sec,cat,item,val){
  if(!draft[sec])draft[sec]={};
  if(!draft[sec][cat])draft[sec][cat]={};
  draft[sec][cat][item]=val;
}

function mkSec(icon,label,key){
  const card=document.createElement('div');card.className='sec-card';
  const head=document.createElement('div');head.className='sec-head';
  head.innerHTML=`<div class="sec-head-l"><span class="sec-icon">${icon}</span><span class="sec-label">${label}</span></div><div class="sec-right"><span class="sec-total" id="st-${key}">₹0</span><span class="sec-chev">▾</span></div>`;
  head.onclick=()=>card.classList.toggle('col');
  const body=document.createElement('div');body.className='sec-body';
  card.appendChild(head);card.appendChild(body);
  return{card,body};
}
function mkCatBlock(label,id,val){
  const cb=document.createElement('div');
  const ch=document.createElement('div');ch.className='cat-head';
  ch.innerHTML=`<span>${label}</span><span class="cat-sub" id="${id}">${fmt(val)}</span>`;
  cb.appendChild(ch);return cb;
}
function mkRow(label,value,onChange){
  const row=document.createElement('div');row.className='row-item';
  const lbl=document.createElement('span');lbl.className='row-lbl';lbl.textContent=label;
  row.appendChild(lbl);row.appendChild(mkInpEl(value,onChange));
  return row;
}
function mkInpEl(value,onChange){
  const inp=document.createElement('input');
  inp.className='row-inp'+(value?' filled':'');
  inp.type='text';inp.inputMode='numeric';inp.placeholder='0';
  inp.value=value?Number(value).toLocaleString('en-IN'):'';
  inp.onfocus=()=>{inp.value=inp.value.replace(/,/g,'');};
  inp.onblur=()=>{
    const n=parseFloat(inp.value.replace(/,/g,''))||0;
    inp.value=n?n.toLocaleString('en-IN'):'';
    inp.classList.toggle('filled',!!n);
    onChange(n||0);
  };
  inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};
  return inp;
}
function refreshTotals(base){
  const m=JSON.parse(JSON.stringify(base));
  for(const sec of ['inc','exp']){
    if(draft[sec])for(const[c,items] of Object.entries(draft[sec])){
      if(!m[sec])m[sec]={};if(!m[sec][c])m[sec][c]={};Object.assign(m[sec][c],items);
    }
  }
  INC_STRUCT.forEach(({cat})=>{const el=document.getElementById(`si-${cat}`);if(el)el.textContent=fmt(catTot(m,'inc',cat));});
  EXP_STRUCT.forEach(({cat})=>{const el=document.getElementById(`se-${cat}`);if(el)el.textContent=fmt(catTot(m,'exp',cat));});
  ['inc','exp','debt'].forEach(k=>{const el=document.getElementById(`st-${k}`);if(el){
    if(k==='inc')el.textContent=fmt(secTot(m,'inc',INC_STRUCT));
    else if(k==='exp')el.textContent=fmt(secTot(m,'exp',EXP_STRUCT.filter(s=>s.cat!=='Debt')));
    else el.textContent=fmt(catTot(m,'exp','Debt'));
  }});
}

function saveMonth(){
  if(!Object.keys(draft).length){flash();return;}
  const all=loadAll();
  const ex=all[selKey]||{inc:{},exp:{}};
  for(const sec of ['inc','exp']){
    if(draft[sec])for(const[c,items] of Object.entries(draft[sec])){
      if(!ex[sec][c])ex[sec][c]={};
      for(const[i,v] of Object.entries(items)){if(v)ex[sec][c][i]=v;else delete ex[sec][c][i];}
    }
  }
  all[selKey]=ex;saveAll(all);draft={};
  document.querySelectorAll('.mp').forEach(b=>{if(b.dataset.key===selKey)b.classList.add('has-data');});
  flash();pushToGitHub(all);
}
function flash(){const el=document.getElementById('saveMsg');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}

function renderDashboard(){
  const filled=ALL_MONTHS.filter(({key})=>{const s=mSum(key);return s.inc>0||s.exp>0;});
  if(!filled.length)return;
  const ti=filled.reduce((s,{key})=>s+mSum(key).inc,0);
  const te=filled.reduce((s,{key})=>s+mSum(key).exp,0);
  const ts=ti-te;
  const td=filled.reduce((s,{key})=>s+(mSum(key).byCat['Debt']||0),0);

  document.getElementById('kpiGrid').innerHTML=`
    <div class="kpi k1"><div class="kpi-lbl">Total Income</div><div class="kpi-val">${fmt(ti)}</div><div class="kpi-sub">${filled.length} months</div></div>
    <div class="kpi k2"><div class="kpi-lbl">Total Expenses</div><div class="kpi-val">${fmt(te)}</div><div class="kpi-sub">all categories</div></div>
    <div class="kpi k3"><div class="kpi-lbl">Net Savings</div><div class="kpi-val ${ts>=0?'pos':'neg'}">${fmtS(ts)}</div><div class="kpi-sub">${ti>0?Math.round(ts/ti*100):0}% of income</div></div>
    <div class="kpi k4"><div class="kpi-lbl">Debt Repaid</div><div class="kpi-val" style="color:var(--gold)">${fmt(td)}</div><div class="kpi-sub">total so far</div></div>`;

  drawMain(filled);drawDonut(filled);renderBudget(filled);renderDiscTable(filled);renderYearTable(filled);
}

function shortLabel(key){const m=ALL_MONTHS.find(x=>x.key===key);return`${m.label}'${String(m.year).slice(2)}`;}

function drawMain(filled){
  if(chartMain){chartMain.destroy();chartMain=null;}
  const ctx=document.getElementById('mainChart').getContext('2d');
  const labels=filled.map(({key})=>shortLabel(key));
  let datasets=[];
  const palette=['#5c7a6a','#c4664a','#4a8c5c','#4a7fa5','#c49a3c'];
  if(chartType==='overview'){
    datasets=[
      {label:'Income',data:filled.map(({key})=>mSum(key).inc),backgroundColor:'rgba(92,122,106,0.75)',borderRadius:4},
      {label:'Expenses',data:filled.map(({key})=>mSum(key).exp),backgroundColor:'rgba(196,102,74,0.75)',borderRadius:4},
      {label:'Savings',data:filled.map(({key})=>mSum(key).sav),backgroundColor:filled.map(({key})=>mSum(key).sav>=0?'rgba(74,140,92,0.75)':'rgba(184,84,80,0.65)'),borderRadius:4},
    ];
  }else if(chartType==='discipline'){
    datasets=INC_STRUCT.map(({cat},i)=>({label:cat,data:filled.map(({key})=>mSum(key).byDisc[cat]||0),backgroundColor:palette[i%palette.length]+'CC',borderRadius:3}));
  }else{
    datasets=EXP_STRUCT.map(({cat},i)=>({label:cat,data:filled.map(({key})=>mSum(key).byCat[cat]||0),backgroundColor:palette[i%palette.length]+'CC',borderRadius:3}));
  }
  chartMain=new Chart(ctx,{
    type:'bar',data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#6b6560',font:{family:'Nunito Sans',size:11},boxWidth:12,padding:10}}},
      scales:{
        x:{stacked:chartType!=='overview',grid:{display:false},ticks:{color:'#a39e97',font:{size:10}}},
        y:{stacked:chartType!=='overview',grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'#a39e97',font:{size:10},callback:v=>{if(v>=100000)return'₹'+(v/100000).toFixed(1)+'L';if(v>=1000)return'₹'+(v/1000).toFixed(0)+'k';return'₹'+v;}}},
      }
    }
  });
  // Fixed height so it doesn't overflow
  document.getElementById('mainChart').style.height='220px';
}

function drawDonut(filled){
  if(chartDonut){chartDonut.destroy();chartDonut=null;}
  const ctx=document.getElementById('donutChart').getContext('2d');
  const recent=filled[filled.length-1];
  const data=EXP_STRUCT.map(({cat})=>donutType==='all'?filled.reduce((s,{key})=>s+(mSum(key).byCat[cat]||0),0):(mSum(recent.key).byCat[cat]||0));
  const labels=EXP_STRUCT.map(s=>s.cat);
  const clrs=['#5c7a6a','#c4664a','#4a7fa5','#c49a3c','#b85450'];
  chartDonut=new Chart(ctx,{
    type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:clrs,borderWidth:3,borderColor:'#fffdf9'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
      plugins:{legend:{position:'bottom',labels:{color:'#6b6560',font:{family:'Nunito Sans',size:11},padding:10,boxWidth:12}}},
    }
  });
  document.getElementById('donutChart').style.height='220px';
}

function renderBudget(filled){
  const recent=filled[filled.length-1];
  const rs=mSum(recent.key);
  const m=ALL_MONTHS.find(x=>x.key===recent.key);
  document.getElementById('budgetLabel').textContent=`💰 Budget — ${m.label} ${m.year}`;
  const grid=document.getElementById('budgetGrid');grid.innerHTML='';
  BUDGET_CFG.forEach(({label,pct,cats,isSav})=>{
    let actual=0;
    if(isSav)actual=rs.sav;else if(cats)cats.forEach(c=>{actual+=(rs.byCat[c]||0);});
    const target=rs.inc*pct;
    const ratio=target>0?actual/target:0;
    const cls=ratio<=1.05?'ok':ratio<=1.25?'warn':'over';
    const barW=Math.min(Math.abs(ratio)*100,100);
    const div=document.createElement('div');div.className='bitem';
    div.innerHTML=`
      <div class="bitem-top"><span class="bitem-name">${label}</span><span class="bitem-status ${cls}">${Math.round(ratio*100)}%</span></div>
      <div class="bbar"><div class="bbar-fill ${cls}" style="width:${barW}%"></div></div>
      <div class="bitem-amts"><span>${fmt(actual)}</span><span>target ${fmt(target)}</span></div>`;
    grid.appendChild(div);
  });
}

function renderDiscTable(filled){
  const t=document.getElementById('discTable');
  const sL=filled.map(({key})=>shortLabel(key));
  t.innerHTML=`<thead><tr><th>Discipline</th>${sL.map(l=>`<th>${l}</th>`).join('')}<th>Total</th></tr></thead>`;
  const tb=document.createElement('tbody');
  INC_STRUCT.forEach(({cat})=>{
    const vals=filled.map(({key})=>mSum(key).byDisc[cat]||0);
    const tot=vals.reduce((s,v)=>s+v,0);if(!tot)return;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${cat}</td>${vals.map(v=>`<td class="${v?'':'muted'}">${v?fmt(v):'-'}</td>`).join('')}<td><strong>${fmt(tot)}</strong></td>`;
    tb.appendChild(tr);
  });
  const totr=document.createElement('tr');totr.className='tot';
  const tots=filled.map(({key})=>mSum(key).inc);
  totr.innerHTML=`<td>Total</td>${tots.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${fmt(tots.reduce((s,v)=>s+v,0))}</td>`;
  tb.appendChild(totr);t.appendChild(tb);
}

function renderYearTable(filled){
  const t=document.getElementById('yearTable');
  t.innerHTML=`<thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Savings</th><th>Sav%</th></tr></thead>`;
  const tb=document.createElement('tbody');
  filled.forEach(({key})=>{
    const s=mSum(key);const m=ALL_MONTHS.find(x=>x.key===key);
    const pct=s.inc>0?Math.round(s.sav/s.inc*100):0;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${m.label} ${m.year}</td><td>${fmt(s.inc)}</td><td>${fmt(s.exp)}</td>
      <td class="${s.sav>=0?'pos':'neg'}">${fmtS(s.sav)}</td>
      <td class="${pct>=0?'pos':'neg'}">${pct}%</td>`;
    tb.appendChild(tr);
  });
  const totr=document.createElement('tr');totr.className='tot';
  const ti=filled.reduce((s,{key})=>s+mSum(key).inc,0);
  const te=filled.reduce((s,{key})=>s+mSum(key).exp,0);
  const ts=ti-te;const tp=ti>0?Math.round(ts/ti*100):0;
  totr.innerHTML=`<td>Total</td><td>${fmt(ti)}</td><td>${fmt(te)}</td>
    <td class="${ts>=0?'pos':'neg'}">${fmtS(ts)}</td>
    <td class="${tp>=0?'pos':'neg'}">${tp}%</td>`;
  tb.appendChild(totr);t.appendChild(tb);
}

function switchChart(type,btn){
  chartType=type;
  document.querySelectorAll('#page-dashboard .chart-card:first-of-type .ct').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  const filled=ALL_MONTHS.filter(({key})=>{const s=mSum(key);return s.inc>0||s.exp>0;});
  drawMain(filled);
}
function switchDonut(type,btn){
  donutType=type;
  document.querySelectorAll('#page-dashboard .chart-card:nth-of-type(2) .ct').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  const filled=ALL_MONTHS.filter(({key})=>{const s=mSum(key);return s.inc>0||s.exp>0;});
  drawDonut(filled);
}

// ══════════════════════════════════════════════════════
// DEBT
// ══════════════════════════════════════════════════════
function renderDebt(){
  const dr=debtRunning();
  const DEBT_OPEN=getDebtOpen();
  const filled=ALL_MONTHS.filter(({key})=>{const s=mSum(key);return s.inc>0||s.exp>0;});
  const lastKey=filled.length>0?filled[filled.length-1].key:ALL_MONTHS[0].key;

  // Summary cards
  const sg=document.getElementById('debtSummaryGrid');sg.innerHTML='';
  for(const[name,opening] of Object.entries(DEBT_OPEN)){
    const rem=dr[name]?.[lastKey]?.balance??opening;
    const paid=opening-rem;
    const pct=opening>0?Math.min(Math.round(paid/opening*100),100):0;
    const card=document.createElement('div');card.className='debt-sum-card';
    card.innerHTML=`
      <div class="dscard-name">${name}</div>
      <div class="dscard-rem ${rem<=0?'cleared':''}">${rem<=0?'Cleared! 🎉':fmt(rem)}</div>
      <div class="dprog"><div class="dprog-fill" style="width:${pct}%"></div></div>
      <div class="dscard-sub"><span>${pct}% paid</span><span>${fmt(paid)} paid</span></div>`;
    sg.appendChild(card);
  }

  // Running balance table
  const t=document.getElementById('debtRunTable');
  const sL=filled.map(({key})=>shortLabel(key));
  t.innerHTML=`<thead><tr><th>Creditor</th><th>Opening</th>${sL.map(l=>`<th>${l}</th>`).join('')}</tr></thead>`;
  const tb=document.createElement('tbody');
  for(const[name,opening] of Object.entries(DEBT_OPEN)){
    const tr=document.createElement('tr');
    const cells=filled.map(({key})=>{
      const bal=dr[name]?.[key]?.balance??opening;
      const paid=dr[name]?.[key]?.payment||0;
      const cls=bal<=0?'pos':paid>0?'':'muted';
      return`<td class="${cls}">${bal<=0?'✓':fmt(bal)}</td>`;
    }).join('');
    tr.innerHTML=`<td>${name}</td><td class="muted">${fmt(opening)}</td>${cells}`;
    tb.appendChild(tr);
  }
  t.appendChild(tb);
}

function openAddLoan(){document.getElementById('modalOverlay').classList.add('open');}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');document.getElementById('newLoanName').value='';document.getElementById('newLoanAmt').value='';}
function closeModalIfBg(e){if(e.target===document.getElementById('modalOverlay'))closeModal();}
function addLoan(){
  const name=document.getElementById('newLoanName').value.trim();
  const amt=parseFloat(document.getElementById('newLoanAmt').value)||0;
  if(!name){alert('Please enter a name');return;}
  if(amt<=0){alert('Please enter an opening balance greater than 0');return;}
  const all=loadAll();
  if(!all.__loans)all.__loans={};
  all.__loans[name]=amt;
  saveAll(all);
  closeModal();
  renderDebt();
  // Also refresh entry if on debt tab
  alert(`✓ Loan "${name}" (${fmt(amt)}) added! It will appear in the Debt Payments section next time you open Entry.`);
  pushToGitHub(all);
}
