<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dojo Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0d12;
  --bg2: #0f1318;
  --bg3: #151a22;
  --bg4: #1c2330;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8edf5;
  --text2: #8b95a8;
  --text3: #4a5568;
  --gold: #c9a84c;
  --gold2: #e8c96a;
  --gold-dim: rgba(201,168,76,0.15);
  --green: #2ecc8a;
  --green-dim: rgba(46,204,138,0.12);
  --red: #e05252;
  --red-dim: rgba(224,82,82,0.12);
  --blue: #4a9eff;
  --blue-dim: rgba(74,158,255,0.12);
  --orange: #ff8c42;
  --orange-dim: rgba(255,140,66,0.12);
  --purple: #a78bfa;
  --purple-dim: rgba(167,139,250,0.12);
  --r: 10px;
  --r-sm: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 0%, rgba(201,168,76,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 30% at 85% 100%, rgba(74,158,255,0.05) 0%, transparent 70%);
}

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 200;
  height: 56px;
  background: rgba(10,13,18,0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 24px; gap: 0;
}
.brand {
  font-family: 'Playfair Display', serif;
  font-size: 17px; font-weight: 700;
  color: var(--gold2);
  margin-right: 28px;
  letter-spacing: 0.3px;
}
.nav-tabs { display: flex; gap: 2px; }
.nt {
  padding: 7px 14px; border-radius: var(--r-sm);
  border: none; background: transparent;
  font-family: 'Outfit', sans-serif;
  font-size: 13px; font-weight: 500;
  color: var(--text2); cursor: pointer;
  transition: all 0.15s;
}
.nt:hover { color: var(--text); background: var(--bg3); }
.nt.active { color: var(--gold2); background: var(--gold-dim); }
.nav-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
#syncBadge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; padding: 3px 9px;
  border-radius: 20px; border: 1px solid var(--border2);
  color: var(--text2); transition: all 0.3s;
}
.cur-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 600;
  padding: 3px 10px; border-radius: 20px;
  background: var(--gold-dim); color: var(--gold2);
  border: 1px solid rgba(201,168,76,0.3);
}

/* ── PAGES ── */
.page { display: none; padding: 28px 28px 80px; max-width: 1180px; margin: 0 auto; position: relative; z-index: 1; }
.page.active { display: block; animation: fadeUp 0.25s ease; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* ── PAGE TITLES ── */
.pg-title {
  font-family: 'Playfair Display', serif;
  font-size: 28px; font-weight: 700;
  margin-bottom: 24px; letter-spacing: -0.3px;
}
.pg-title span { color: var(--gold2); }

/* ── CARDS ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}
.card-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between;
  color: var(--text2); letter-spacing: 0.3px;
}
.card-head span { color: var(--text); }

/* ── MONTH SELECTOR ── */
.month-bar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 22px; flex-wrap: wrap;
}
.month-bar-label { font-size: 11px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
.month-pills { display: flex; gap: 4px; flex-wrap: wrap; }
.mp {
  padding: 5px 13px; border-radius: 20px;
  border: 1px solid var(--border2);
  background: transparent; font-size: 11px; font-weight: 600;
  color: var(--text2); cursor: pointer;
  transition: all 0.14s;
  font-family: 'JetBrains Mono', monospace;
  position: relative;
}
.mp:hover { border-color: var(--gold); color: var(--gold2); }
.mp.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold2); }
.mp.has-data::after { content: ''; position: absolute; top: 3px; right: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--green); }
.mp.cur { border-color: rgba(201,168,76,0.4); }

/* ── ENTRY SECTIONS ── */
.sec-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden; margin-bottom: 12px;
}
.sec-head {
  padding: 13px 18px; display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none; transition: background 0.14s;
}
.sec-head:hover { background: var(--bg3); }
.sec-head-l { display: flex; align-items: center; gap: 10px; }
.sec-icon { font-size: 16px; }
.sec-label { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 600; }
.sec-total { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text2); }
.sec-chev { font-size: 10px; color: var(--text3); transition: transform 0.2s; margin-left: 8px; }
.sec-card.col .sec-chev { transform: rotate(-90deg); }
.sec-card.col .sec-body { display: none; }
.sec-body { border-top: 1px solid var(--border); }

.cat-head {
  padding: 8px 18px 8px 28px;
  font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--text3); background: rgba(255,255,255,0.02);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.cat-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; }

.row-item {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 10px;
  padding: 7px 18px 7px 36px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  transition: background 0.1s;
}
.row-item:last-child { border-bottom: none; }
.row-item:hover { background: rgba(255,255,255,0.02); }
.row-lbl { font-size: 13px; color: var(--text2); }

/* Debt row — shows running balance */
.row-item.debt-row { grid-template-columns: 1fr auto auto; gap: 12px; }
.debt-balance-pill {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  padding: 2px 8px; border-radius: 20px;
  background: var(--red-dim); color: var(--red);
  border: 1px solid rgba(224,82,82,0.2);
  white-space: nowrap;
}
.debt-balance-pill.cleared { background: var(--green-dim); color: var(--green); border-color: rgba(46,204,138,0.2); }

.row-inp {
  width: 120px; padding: 5px 10px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  text-align: right; outline: none; transition: all 0.14s;
}
.row-inp:focus { border-color: var(--gold); background: var(--gold-dim); }
.row-inp.filled { border-color: rgba(46,204,138,0.3); background: var(--green-dim); }
.row-inp::placeholder { color: var(--text3); }

.save-bar {
  position: sticky; bottom: 0; z-index: 10;
  padding: 14px 0;
  background: linear-gradient(to top, var(--bg) 50%, transparent);
  display: flex; gap: 10px; align-items: center;
}
.btn-save {
  padding: 10px 28px; background: var(--gold); color: var(--bg);
  border: none; border-radius: var(--r-sm);
  font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px;
}
.btn-save:hover { background: var(--gold2); transform: translateY(-1px); }
.save-msg { font-size: 12px; color: var(--green); opacity: 0; transition: opacity 0.3s; font-family: 'JetBrains Mono', monospace; }
.save-msg.show { opacity: 1; }

/* ── KPI CARDS ── */
.kpi-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
.kpi {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px 18px;
  position: relative; overflow: hidden;
  transition: border-color 0.2s;
}
.kpi:hover { border-color: var(--border2); }
.kpi::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; }
.kpi.k-inc::after { background: linear-gradient(90deg, var(--gold), transparent); }
.kpi.k-exp::after { background: linear-gradient(90deg, var(--red), transparent); }
.kpi.k-sav::after { background: linear-gradient(90deg, var(--green), transparent); }
.kpi.k-dbt::after { background: linear-gradient(90deg, var(--orange), transparent); }
.kpi-lbl { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.kpi-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; line-height: 1; }
.kpi-val.pos { color: var(--green); }
.kpi-val.neg { color: var(--red); }
.kpi-val.gold { color: var(--gold2); }
.kpi-sub { font-size: 11px; color: var(--text3); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }

/* ── CHART AREA ── */
.chart-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px; margin-bottom: 16px;
}
.chart-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.chart-title { font-size: 13px; font-weight: 600; color: var(--text2); }
.chart-tabs { display: flex; gap: 4px; }
.ct {
  padding: 4px 11px; border-radius: 20px;
  border: 1px solid var(--border); background: transparent;
  font-size: 10px; font-weight: 600; color: var(--text3); cursor: pointer;
  font-family: 'JetBrains Mono', monospace; transition: all 0.14s;
}
.ct:hover { color: var(--text2); border-color: var(--border2); }
.ct.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold2); }

.charts-2col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; margin-bottom: 16px; }

/* ── TABLES ── */
.tbl-wrap { overflow-x: auto; }
table.ft { width: 100%; border-collapse: collapse; }
table.ft th {
  padding: 9px 14px; font-size: 10px; font-weight: 600;
  letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--text3); text-align: right;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.ft th:first-child { text-align: left; }
table.ft td {
  padding: 8px 14px; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; text-align: right;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  white-space: nowrap;
}
table.ft td:first-child { font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 500; text-align: left; color: var(--text); }
table.ft tr:last-child td { border-bottom: none; }
table.ft tr.tot td { font-weight: 700; border-top: 1px solid var(--border); color: var(--text); background: rgba(255,255,255,0.02); }
table.ft tr:hover:not(.tot) td { background: rgba(255,255,255,0.02); }
td.pos { color: var(--green) !important; }
td.neg { color: var(--red) !important; }
td.dim { color: var(--text2); }
td.muted { color: var(--text3); }

/* ── BUDGET ── */
.budget-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding: 16px 18px; }
.bitem { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 14px; }
.bitem-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.bitem-name { font-size: 11px; font-weight: 600; color: var(--text2); }
.bitem-pct { font-family: 'JetBrains Mono', monospace; font-size: 10px; }
.bitem-pct.ok { color: var(--green); }
.bitem-pct.warn { color: var(--orange); }
.bitem-pct.over { color: var(--red); }
.bbar { height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
.bbar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
.bbar-fill.ok { background: var(--green); }
.bbar-fill.warn { background: var(--orange); }
.bbar-fill.over { background: var(--red); }
.bitem-amts { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3); }

/* ── DEBT PAGE ── */
.debt-summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
.debt-sum-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px 18px;
}
.dscard-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.dscard-rem { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: var(--red); margin-bottom: 8px; }
.dscard-rem.cleared { color: var(--green); }
.dprog { height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
.dprog-fill { height: 100%; border-radius: 2px; background: var(--green); transition: width 0.6s; }
.dscard-sub { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3); }

.debt-table-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.debt-table-head { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text2); }

@media(max-width:768px){
  .page{padding:16px 16px 80px;}
  .kpi-row{grid-template-columns:1fr 1fr;}
  .charts-2col{grid-template-columns:1fr;}
  .debt-summary-grid{grid-template-columns:1fr 1fr;}
  .budget-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<nav>
  <div class="brand">DOJO FINANCE</div>
  <div class="nav-tabs">
    <button class="nt active" onclick="showPage('entry',this)">Entry</button>
    <button class="nt" onclick="showPage('dashboard',this)">Dashboard</button>
    <button class="nt" onclick="showPage('debt',this)">Debt</button>
  </div>
  <div class="nav-r">
    <span id="syncBadge">—</span>
    <span class="cur-badge" id="curBadge">APR 2025</span>
  </div>
</nav>

<!-- ENTRY -->
<div class="page active" id="page-entry">
  <div class="pg-title">Monthly <span>Entry</span></div>
  <div class="month-bar">
    <span class="month-bar-label">Month</span>
    <div class="month-pills" id="monthPills"></div>
  </div>
  <div id="entryGrid"></div>
  <div class="save-bar">
    <button class="btn-save" onclick="saveMonth()">Save Month</button>
    <span class="save-msg" id="saveMsg">✓ Saved</span>
  </div>
</div>

<!-- DASHBOARD -->
<div class="page" id="page-dashboard">
  <div class="pg-title">Annual <span>Overview</span></div>
  <div class="kpi-row" id="kpiRow"></div>
  <div class="charts-2col">
    <div class="chart-card">
      <div class="chart-top">
        <span class="chart-title">Income vs Expenses vs Savings</span>
        <div class="chart-tabs">
          <button class="ct active" onclick="switchMainChart('overview',this)">Overview</button>
          <button class="ct" onclick="switchMainChart('discipline',this)">Discipline</button>
          <button class="ct" onclick="switchMainChart('category',this)">Category</button>
        </div>
      </div>
      <canvas id="mainChart" height="240"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-top">
        <span class="chart-title">Expense Breakdown</span>
        <div class="chart-tabs">
          <button class="ct active" onclick="switchDonut('all',this)">All time</button>
          <button class="ct" onclick="switchDonut('month',this)">This month</button>
        </div>
      </div>
      <canvas id="donutChart" height="240"></canvas>
    </div>
  </div>

  <!-- Budget allocation -->
  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><span id="budgetHeadLabel">💰 Budget Allocation</span></div>
    <div class="budget-grid" id="budgetGrid"></div>
  </div>

  <!-- Income by discipline -->
  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><span>🥋 Income by Discipline</span></div>
    <div class="tbl-wrap"><table class="ft" id="discTable"></table></div>
  </div>

  <!-- Full year summary -->
  <div class="card">
    <div class="card-head"><span>📅 Full Year Summary</span></div>
    <div class="tbl-wrap"><table class="ft" id="yearTable"></table></div>
  </div>
</div>

<!-- DEBT -->
<div class="page" id="page-debt">
  <div class="pg-title">Debt <span>Tracker</span></div>
  <div id="debtSummaryGrid" class="debt-summary-grid"></div>
  <div class="debt-table-card">
    <div class="debt-table-head">📊 Running Balance — month by month</div>
    <div class="tbl-wrap"><table class="ft" id="debtRunTable"></table></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ════════════════════════════════════════════════════════
// MONTH GENERATION — Sep 2024 → Dec 2027
// ════════════════════════════════════════════════════════
function genMonths() {
  const out = [];
  const seq = [
    {y:2025, months:["Sep","Oct","Nov","Dec"]},
    {y:2026, months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]},
    {y:2027, months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]},
  ];
  seq.forEach(({y,months}) => months.forEach(m => out.push({key:`${m}-${y}`, label:m, year:y})));
  return out;
}
const ALL_MONTHS = genMonths();

// Current month key
function curMonthKey() {
  const now = new Date();
  const LABELS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${LABELS[now.getMonth()]}-${now.getFullYear()}`;
}
const CUR_KEY = curMonthKey();

const INC_STRUCT = [
  {cat:"Aikido",  items:["AVM","Ruqshad","Mythreyan","Ramji","Sakthi","Roobini","Guru","Kashif","Rahul","Yohesh","Pritham","Ardesh","Magesh","Srinidhi","Khushi","Arshad Syed"]},
  {cat:"Kendo",   items:["Arjun","Aravind","Aakash","Rahul","Pradhyumna","Rohit","Ardesh"]},
  {cat:"Karate",  items:["Lakshitha","Iniyan","Riyaan","Sashwa","Rohit","Rehaan","Kallolini"]},
  {cat:"CKC",     items:["CKC Rent","CKC Transport","El Dojo Rent","CKC Marketing","CKC Misc"]},
  {cat:"Others",  items:["Chandana","Udayan","Roobini","Emmam","Coaching","Aiki Semi","Aiki Grading","Shinai Sale","Bhogo Sale","Other"]},
];
const EXP_STRUCT = [
  {cat:"Personal",  items:["Daily expenses","Misc personal"]},
  {cat:"Business",  items:["Selvam salary","Chandru","Whistle/Equipment","Porter/Transport","Sasaki","Risa San treat","CK Rental","AVM events","Business misc"]},
  {cat:"Utilities", items:["Household","Petrol/Fuel","Postpaid bill","Prepaid recharge","Groceries","Netflix","AC/Appliances","Bike service","Insurance","Doctor/Medicine","Electricity","Utilities misc"]},
  {cat:"Family",    items:["Monthly grocery","Family outings","Gifts","Kids expenses","Clothing","Travel tickets","Family misc"]},
  {cat:"Debt",      items:["Sriram","Sakthi","Jo","Ramamurthy","Gautam","Sensei","Gold Loan","Other"]},
];
const DEBT_OPEN = {Gautam:300000,Ramamurthy:50000,Sriram:250000,Jo:30000,Sakthi:17000,Sensei:20000,"Gold Loan":2000000,Other:0};
const BUDGET_CFG = [
  {label:"Essentials",  pct:0.50, cats:["Personal","Business","Utilities"]},
  {label:"Debt",        pct:0.30, cats:["Debt"]},
  {label:"Savings",     pct:0.10, isSav:true},
  {label:"Family",      pct:0.05, cats:["Family"]},
  {label:"Growth",      pct:0.05, cats:null},

const SK = "dojo_v5";
let _cache = null, _sha = null;

function loadAll() {
  if (_cache) return _cache;
  try { _cache = JSON.parse(localStorage.getItem(SK)||'{}'); }
  catch(e) { _cache = {}; }
  return _cache;
}
function saveAll(d) { _cache = d; localStorage.setItem(SK, JSON.stringify(d)); }
function getMonth(key) {
  const all = loadAll();
  if (all[key]) return all[key];
  if (HIST[key]) return JSON.parse(JSON.stringify(HIST[key]));
  return {inc:{}, exp:{}};
}
function seedHistory() {
  const all = loadAll(); let ch = false;
  for (const [k,v] of Object.entries(HIST)) {
    if (!all[k]) { all[k] = JSON.parse(JSON.stringify(v)); ch = true; }
  }
  if (ch) saveAll(all);
}

async function syncFromGitHub() {
  try {
    setSyncBadge('syncing…','var(--text3)');
    const r = await fetch('/api/save');
    if (!r.ok) throw new Error();
    const {data, sha} = await r.json();
    _sha = sha;
    const local = loadAll();
    saveAll(Object.assign({}, local, data));
    rerender();
    setSyncBadge('✓ synced','var(--green)');
  } catch(e) { setSyncBadge('offline','var(--orange)'); }
}
async function pushToGitHub(data) {
  if (!_sha) { try { const r=await fetch('/api/save'); if(r.ok){const j=await r.json();_sha=j.sha;} } catch(e){} }
  if (!_sha) { setSyncBadge('saved locally','var(--orange)'); return; }
  try {
    setSyncBadge('saving…','var(--text3)');
    const r = await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data,sha:_sha})});
    if (!r.ok) throw new Error();
    try { const r2=await fetch('/api/save'); if(r2.ok){const j=await r2.json();_sha=j.sha;} } catch(e){}
    setSyncBadge('✓ saved','var(--green)');
  } catch(e) { setSyncBadge('saved locally','var(--orange)'); }
}
function setSyncBadge(t,c) { const el=document.getElementById('syncBadge'); el.textContent=t; el.style.color=c; }

function catTot(d,sec,cat) { return Object.values(d[sec]?.[cat]||{}).reduce((s,v)=>s+(+v||0),0); }
function secTot(d,sec,struct) { return struct.reduce((s,{cat})=>s+catTot(d,sec,cat),0); }

function mSummary(key) {
  const d = getMonth(key);
  const inc = secTot(d,'inc',INC_STRUCT);
  const exp = secTot(d,'exp',EXP_STRUCT);
  const byCat = {}, byDisc = {};
  EXP_STRUCT.forEach(({cat})=>{ byCat[cat]=catTot(d,'exp',cat); });
  INC_STRUCT.forEach(({cat})=>{ byDisc[cat]=catTot(d,'inc',cat); });
  return {inc, exp, sav:inc-exp, byCat, byDisc};
}

// Compute running debt balances for all months in order
function debtRunning() {
  // Returns: { creditor: { "Mon-YYYY": { payment, balance } } }
  const res = {};
  for (const name of Object.keys(DEBT_OPEN)) {
    res[name] = {};
    let bal = DEBT_OPEN[name];
    for (const {key} of ALL_MONTHS) {
      const d = getMonth(key);
      const payment = d.exp?.['Debt']?.[name] || 0;
      bal -= payment;
      res[name][key] = { payment, balance: bal };
    }
  }
  return res;
}

// Get remaining balance for a creditor as of a specific month
function debtBalanceAt(name, monthKey) {
  const dr = debtRunning();
  return dr[name]?.[monthKey]?.balance ?? DEBT_OPEN[name];
}

function fmt(n) { return '₹' + Math.abs(Math.round(n||0)).toLocaleString('en-IN'); }
function fmtS(n) { return (n<0?'−₹':'₹') + Math.abs(Math.round(n||0)).toLocaleString('en-IN'); }

let selKey = CUR_KEY, draft = {};

function initEntry() {
  const pills = document.getElementById('monthPills');
  pills.innerHTML = '';
  const all = loadAll();
  // Group by year
  const years = {};
  ALL_MONTHS.forEach(m => { (years[m.year]||=[]).push(m); });

  for (const [yr, months] of Object.entries(years)) {
    const grp = document.createElement('div');
    grp.style.cssText = 'display:flex;align-items:center;gap:4px;margin-right:8px;';
    const yrLbl = document.createElement('span');
    yrLbl.style.cssText = 'font-size:9px;color:var(--text3);font-family:JetBrains Mono,monospace;margin-right:2px;';
    yrLbl.textContent = yr;
    grp.appendChild(yrLbl);
    months.forEach(({key,label}) => {
      const btn = document.createElement('button');
      btn.className = 'mp' + (key===CUR_KEY?' cur':'') + (all[key]?' has-data':'');
      if (key===selKey) btn.classList.add('active');
      btn.textContent = label;
      btn.dataset.key = key;
      btn.onclick = () => selectMonth(key, btn);
      grp.appendChild(btn);
    });
    pills.appendChild(grp);
  }
  renderEntry();
}

function selectMonth(key, btn) {
  selKey = key; draft = {};
  document.querySelectorAll('.mp').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderEntry();
}

function renderEntry() {
  const grid = document.getElementById('entryGrid');
  grid.innerHTML = '';
  const data = getMonth(selKey);
  // Compute debt balances at PREVIOUS month for display
  const dr = debtRunning();
  const prevKey = getPrevMonthKey(selKey);

  // INCOME
  const {card:ic, body:ib} = mkSec('📥', 'Income', 'inc');
  INC_STRUCT.forEach(({cat,items}) => {
    const cb = document.createElement('div'); cb.className = 'cat-block';
    const ch = mkCatHead(cat, `si-${cat}`, catTot(data,'inc',cat));
    cb.appendChild(ch);
    items.forEach(item => {
      const v = data.inc?.[cat]?.[item] || '';
      cb.appendChild(mkRow(item, v, (val)=>{
        if (!draft.inc) draft.inc={};
        if (!draft.inc[cat]) draft.inc[cat]={};
        draft.inc[cat][item] = val;
        refreshTotals(data);
      }));
    });
    ib.appendChild(cb);
  });
  grid.appendChild(ic);

  // EXPENSES (non-debt cats)
  const {card:ec, body:eb} = mkSec('📤', 'Expenses', 'exp');
  EXP_STRUCT.filter(s=>s.cat!=='Debt').forEach(({cat,items}) => {
    const cb = document.createElement('div'); cb.className = 'cat-block';
    cb.appendChild(mkCatHead(cat, `se-${cat}`, catTot(data,'exp',cat)));
    items.forEach(item => {
      const v = data.exp?.[cat]?.[item] || '';
      cb.appendChild(mkRow(item, v, (val)=>{
        if (!draft.exp) draft.exp={};
        if (!draft.exp[cat]) draft.exp[cat]={};
        draft.exp[cat][item] = val;
        refreshTotals(data);
      }));
    });
    eb.appendChild(cb);
  });
  grid.appendChild(ec);

  // DEBT — special section showing running balance
  const {card:dc, body:db} = mkSec('💳', 'Debt Payments', 'debt');
  const debtCat = EXP_STRUCT.find(s=>s.cat==='Debt');
  const debtCb = document.createElement('div'); debtCb.className = 'cat-block';
  const debtCh = document.createElement('div'); debtCh.className = 'cat-head';
  debtCh.innerHTML = `<span>Creditor</span><span style="display:flex;gap:16px"><span style="color:var(--text3)">Paid this month</span><span style="color:var(--text3);width:120px;text-align:right">Remaining balance</span></span>`;
  debtCb.appendChild(debtCh);
  debtCat.items.forEach(name => {
    const v = data.exp?.['Debt']?.[name] || '';
    // Balance before this month's payment
    const balBefore = prevKey ? (dr[name]?.[prevKey]?.balance ?? DEBT_OPEN[name]) : DEBT_OPEN[name];
    const paid = draft.exp?.['Debt']?.[name] ?? (data.exp?.['Debt']?.[name] || 0);
    const remaining = balBefore - paid;
    const pill = document.createElement('span');
    pill.className = 'debt-balance-pill' + (remaining<=0?' cleared':'');
    pill.id = `dbp-${name}`;
    pill.textContent = remaining <= 0 ? 'Cleared!' : fmt(remaining);

    const row = document.createElement('div');
    row.className = 'row-item debt-row';
    const lbl = document.createElement('span'); lbl.className='row-lbl'; lbl.textContent=name;
    const inp = mkInpEl(v, (val)=>{
      if (!draft.exp) draft.exp={};
      if (!draft.exp['Debt']) draft.exp['Debt']={};
      draft.exp['Debt'][name] = val;
      // Update pill
      const newPaid = val || 0;
      const newRem = balBefore - newPaid;
      const p = document.getElementById(`dbp-${name}`);
      if (p) { p.textContent = newRem<=0?'Cleared!':fmt(newRem); p.className='debt-balance-pill'+(newRem<=0?' cleared':''); }
      refreshTotals(data);
    });
    row.appendChild(lbl); row.appendChild(inp); row.appendChild(pill);
    debtCb.appendChild(row);
  });
  db.appendChild(debtCb);
  grid.appendChild(dc);

  // Set section totals
  setTimeout(()=>refreshTotals(data),0);
}

function getPrevMonthKey(key) {
  const idx = ALL_MONTHS.findIndex(m=>m.key===key);
  if (idx <= 0) return null;
  return ALL_MONTHS[idx-1].key;
}

function mkSec(icon, label, key) {
  const card = document.createElement('div'); card.className='sec-card';
  const head = document.createElement('div'); head.className='sec-head';
  head.innerHTML=`<div class="sec-head-l"><span class="sec-icon">${icon}</span><span class="sec-label">${label}</span></div><div style="display:flex;align-items:center"><span class="sec-total" id="st-${key}">₹0</span><span class="sec-chev">▼</span></div>`;
  head.onclick=()=>card.classList.toggle('col');
  const body = document.createElement('div'); body.className='sec-body';
  card.appendChild(head); card.appendChild(body);
  return {card,body};
}
function mkCatHead(label, id, val) {
  const h = document.createElement('div'); h.className='cat-head';
  h.innerHTML=`<span>${label}</span><span class="cat-sub" id="${id}">${fmt(val)}</span>`;
  return h;
}
function mkRow(label, value, onChange) {
  const row = document.createElement('div'); row.className='row-item';
  const lbl = document.createElement('span'); lbl.className='row-lbl'; lbl.textContent=label;
  const inp = mkInpEl(value, onChange);
  row.appendChild(lbl); row.appendChild(inp);
  return row;
}
function mkInpEl(value, onChange) {
  const inp = document.createElement('input');
  inp.className='row-inp'+(value?' filled':'');
  inp.type='text'; inp.inputMode='numeric'; inp.placeholder='0';
  inp.value=value?Number(value).toLocaleString('en-IN'):'';
  inp.onfocus=()=>{inp.value=inp.value.replace(/,/g,'');};
  inp.onblur=()=>{
    const n=parseFloat(inp.value.replace(/,/g,''))||0;
    inp.value=n?n.toLocaleString('en-IN'):'';
    inp.classList.toggle('filled',!!n);
    onChange(n||0);
  };
  inp.onkeydown=(e)=>{if(e.key==='Enter')inp.blur();};
  return inp;
}
function refreshTotals(baseData) {
  const m = JSON.parse(JSON.stringify(baseData));
  if (draft.inc) for(const[c,items] of Object.entries(draft.inc)){if(!m.inc[c])m.inc[c]={};Object.assign(m.inc[c],items);}
  if (draft.exp) for(const[c,items] of Object.entries(draft.exp)){if(!m.exp[c])m.exp[c]={};Object.assign(m.exp[c],items);}
  INC_STRUCT.forEach(({cat})=>{const el=document.getElementById(`si-${cat}`);if(el)el.textContent=fmt(catTot(m,'inc',cat));});
  EXP_STRUCT.forEach(({cat})=>{const el=document.getElementById(`se-${cat}`);if(el)el.textContent=fmt(catTot(m,'exp',cat));});
  const si=document.getElementById('st-inc'); if(si)si.textContent=fmt(secTot(m,'inc',INC_STRUCT));
  const se=document.getElementById('st-exp'); if(se)se.textContent=fmt(secTot(m,'exp',EXP_STRUCT));
  const sd=document.getElementById('st-debt'); if(sd)sd.textContent=fmt(catTot(m,'exp','Debt'));
}

function saveMonth() {
  if (!Object.keys(draft).length) { flashSave(); return; }
  const all = loadAll();
  const ex = all[selKey] || {inc:{},exp:{}};
  if (draft.inc) for(const[c,items] of Object.entries(draft.inc)){if(!ex.inc[c])ex.inc[c]={};for(const[i,v] of Object.entries(items)){if(v)ex.inc[c][i]=v;else delete ex.inc[c][i];}}
  if (draft.exp) for(const[c,items] of Object.entries(draft.exp)){if(!ex.exp[c])ex.exp[c]={};for(const[i,v] of Object.entries(items)){if(v)ex.exp[c][i]=v;else delete ex.exp[c][i];}}
  all[selKey] = ex; saveAll(all); draft = {};
  document.querySelectorAll('.mp').forEach(b=>{ if(b.dataset.key===selKey) b.classList.add('has-data'); });
  flashSave();
  pushToGitHub(all);
}
function flashSave() { const el=document.getElementById('saveMsg'); el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }

  const ti=filled.reduce((s,{key})=>s+mSummary(key).inc,0);
  const te=filled.reduce((s,{key})=>s+mSummary(key).exp,0);
  const ts=ti-te;
  const td=filled.reduce((s,{key})=>s+(mSummary(key).byCat['Debt']||0),0);

    <div class="kpi k-inc"><div class="kpi-lbl">Total Income</div><div class="kpi-val gold">${fmt(ti)}</div><div class="kpi-sub">${filled.length} months</div></div>

  drawMainChart(filled);

    scales:{
      x:{stacked:mainChartType!=='overview', grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#4a5568',font:{size:10}}},
      y:{stacked:mainChartType!=='overview', grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'#4a5568',font:{size:10},callback:v=>'₹'+Number(v).toLocaleString('en-IN')}},
    }
  }});
}

function drawDonut(filled) {
  if (chartDonut) { chartDonut.destroy(); chartDonut=null; }
  const ctx = document.getElementById('donutChart').getContext('2d');
  let data;
  if (donutType==='all') {
    data = EXP_STRUCT.map(({cat})=>filled.reduce((s,{key})=>s+(mSummary(key).byCat[cat]||0),0));
  } else {
    const recent = filled[filled.length-1];
    data = EXP_STRUCT.map(({cat})=>mSummary(recent.key).byCat[cat]||0);
  }
  const labels = EXP_STRUCT.map(s=>s.cat);
  const clrs = ['rgba(74,158,255,0.8)','rgba(201,168,76,0.8)','rgba(46,204,138,0.8)','rgba(167,139,250,0.8)','rgba(224,82,82,0.8)'];
  chartDonut = new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:clrs,borderWidth:2,borderColor:'#0a0d12'}]},options:{
    responsive:true,maintainAspectRatio:false,cutout:'65%',
    plugins:{legend:{position:'bottom',labels:{color:'#8b95a8',font:{family:'Outfit',size:11},padding:10}}},
  }});
}

function renderBudget(filled) {
  const recent = filled[filled.length-1];
  const rs = mSummary(recent.key);
  const m = ALL_MONTHS.find(x=>x.key===recent.key);
  document.getElementById('budgetHeadLabel').textContent = `💰 Budget Allocation — ${m.label} ${m.year}`;
  const grid = document.getElementById('budgetGrid'); grid.innerHTML='';
  BUDGET_CFG.forEach(({label,pct,cats,isSav})=>{
    let actual=0;
    if(isSav) actual=rs.sav;
    else if(cats) cats.forEach(c=>{actual+=(rs.byCat[c]||0);});
    const target=rs.inc*pct;
    const ratio=target>0?actual/target:0;
    const barW=Math.min(Math.abs(ratio)*100,100);
    const cls=ratio<=1.05?'ok':ratio<=1.25?'warn':'over';
    const div=document.createElement('div'); div.className='bitem';
    div.innerHTML=`
      <div class="bitem-top">
        <span class="bitem-name">${label}</span>
        <span class="bitem-pct ${cls}">${Math.round(ratio*100)}%</span>
      </div>
      <div class="bbar"><div class="bbar-fill ${cls}" style="width:${barW}%"></div></div>
      <div class="bitem-amts"><span>${fmt(actual)}</span><span>target ${fmt(target)}</span></div>`;
    grid.appendChild(div);
  });
}

function renderDiscTable(filled) {
  const t = document.getElementById('discTable');
  const shortLabels = filled.map(({key})=>{ const m=ALL_MONTHS.find(x=>x.key===key); return `${m.label}'${m.year.toString().slice(2)}`; });
  t.innerHTML=`<thead><tr><th>Discipline</th>${shortLabels.map(l=>`<th>${l}</th>`).join('')}<th>Total</th></tr></thead>`;
  const tb=document.createElement('tbody');
  INC_STRUCT.forEach(({cat})=>{
    const vals=filled.map(({key})=>mSummary(key).byDisc[cat]||0);
    const tot=vals.reduce((s,v)=>s+v,0); if(!tot)return;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${cat}</td>${vals.map(v=>`<td class="${v?'dim':'muted'}">${v?fmt(v):'-'}</td>`).join('')}<td style="font-weight:600">${fmt(tot)}</td>`;
    tb.appendChild(tr);
  });
  const totr=document.createElement('tr'); totr.className='tot';
  const tots=filled.map(({key})=>mSummary(key).inc);
  totr.innerHTML=`<td>Total</td>${tots.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${fmt(tots.reduce((s,v)=>s+v,0))}</td>`;
  tb.appendChild(totr); t.appendChild(tb);
}

function renderYearTable(filled) {
  const t = document.getElementById('yearTable'); t.innerHTML='';
  t.innerHTML=`<thead><tr><th>Month</th><th>Income</th><th>Expenses</th><th>Savings</th><th>Savings%</th><th>Debt Paid</th><th>Rec. Debt (30%)</th></tr></thead>`;
  const tb=document.createElement('tbody');
  filled.forEach(({key})=>{
    const s=mSummary(key); const m=ALL_MONTHS.find(x=>x.key===key);
    const pct=s.inc>0?Math.round(s.sav/s.inc*100):0;
    const recD=Math.round(s.inc*0.30);
    const actD=s.byCat['Debt']||0;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${m.label} ${m.year}</td><td class="dim">${fmt(s.inc)}</td><td class="dim">${fmt(s.exp)}</td>
      <td class="${s.sav>=0?'pos':'neg'}">${fmtS(s.sav)}</td>
      <td class="${pct>=0?'pos':'neg'}">${pct}%</td>
      <td class="${actD>=recD?'pos':'neg'}">${fmt(actD)}</td>
      <td class="muted">${fmt(recD)}</td>`;
    tb.appendChild(tr);
  });
  const totr=document.createElement('tr'); totr.className='tot';
  const ti=filled.reduce((s,{key})=>s+mSummary(key).inc,0);
  const te=filled.reduce((s,{key})=>s+mSummary(key).exp,0);
  const ts=ti-te;
  const tp=ti>0?Math.round(ts/ti*100):0;
  const td=filled.reduce((s,{key})=>s+(mSummary(key).byCat['Debt']||0),0);
  totr.innerHTML=`<td>Total</td><td>${fmt(ti)}</td><td>${fmt(te)}</td>
    <td class="${ts>=0?'pos':'neg'}">${fmtS(ts)}</td>
    <td class="${tp>=0?'pos':'neg'}">${tp}%</td>
    <td>${fmt(td)}</td><td class="muted">${fmt(ti*0.30)}</td>`;
  tb.appendChild(totr); t.appendChild(tb);
}

function switchMainChart(type,btn) {
  mainChartType=type;
  document.querySelectorAll('#page-dashboard .chart-tabs:first-of-type .ct').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const filled=ALL_MONTHS.filter(({key})=>{ const s=mSummary(key); return s.inc>0||s.exp>0; });
  drawMainChart(filled);
}
function switchDonut(type,btn) {
  donutType=type;
  const tabs=document.querySelectorAll('#page-dashboard .chart-card:nth-child(2) .ct');
  tabs.forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const filled=ALL_MONTHS.filter(({key})=>{ const s=mSummary(key); return s.inc>0||s.exp>0; });
  drawDonut(filled);
}

// DEBT PAGE
// ════════════════════════════════════════════════════════
function renderDebt() {
  const dr = debtRunning();
  const filled = ALL_MONTHS.filter(({key})=>{ const s=mSummary(key); return s.inc>0||s.exp>0; });

  // Summary cards
  const sg = document.getElementById('debtSummaryGrid'); sg.innerHTML='';
  for (const [name, opening] of Object.entries(DEBT_OPEN)) {
    const lastKey = filled.length>0?filled[filled.length-1].key:ALL_MONTHS[0].key;
    const rem = dr[name]?.[lastKey]?.balance ?? opening;
    const paid = opening - rem;
    const pct = Math.min(Math.round(paid/opening*100),100);
    const card=document.createElement('div'); card.className='debt-sum-card';
    card.innerHTML=`
      <div class="dscard-name">${name}</div>
      <div class="dscard-rem ${rem<=0?'cleared':''}">${rem<=0?'Cleared!':fmt(rem)}</div>
      <div class="dprog"><div class="dprog-fill" style="width:${pct}%"></div></div>
      <div class="dscard-sub"><span>${pct}% cleared</span><span>Paid ${fmt(paid)}</span></div>`;
    sg.appendChild(card);
  }

  // Running balance table
  const t = document.getElementById('debtRunTable');
  const shortLabels = filled.map(({key})=>{ const m=ALL_MONTHS.find(x=>x.key===key); return `${m.label}'${m.year.toString().slice(2)}`; });
  t.innerHTML=`<thead><tr><th>Creditor</th><th>Opening</th>${shortLabels.map(l=>`<th>${l}</th>`).join('')}</tr></thead>`;
  const tb=document.createElement('tbody');
  for (const [name, opening] of Object.entries(DEBT_OPEN)) {
    const tr=document.createElement('tr');
    const cells = filled.map(({key})=>{
      const bal = dr[name]?.[key]?.balance ?? opening;
      const paid = dr[name]?.[key]?.payment || 0;
      const cls = bal<=0?'pos':paid>0?'dim':'muted';
      return `<td class="${cls}">${bal<=0?'✓':fmt(bal)}</td>`;
    }).join('');
    tr.innerHTML=`<td style="font-weight:600">${name}</td><td class="muted">${fmt(opening)}</td>${cells}`;
    tb.appendChild(tr);
  }
  t.appendChild(tb);
}
